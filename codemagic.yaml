# Codemagic CI/CD for the CARE Flutter app (repo root is the Flutter project).
#
# App Store Connect auth is done ENTIRELY with environment variables (no named
# integration needed). Add these to a variable group called `appstore`
# (App settings → Environment variables → group: appstore):
#   APP_STORE_CONNECT_ISSUER_ID       = 96770401-8bdd-48c3-94d9-11efc4774b50
#   APP_STORE_CONNECT_KEY_IDENTIFIER  = MANR2LGK8P            (the CARE CI key)
#   APP_STORE_CONNECT_PRIVATE_KEY     = <full contents of AuthKey_MANR2LGK8P.p8>  (Secret)
# The app record + bundle id com.carekw.care already exist in App Store Connect.

workflows:
  ios-appstore:
    name: CARE iOS → App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore                    # holds the 3 APP_STORE_CONNECT_* vars
      vars:
        BUNDLE_ID: "com.carekw.care"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files (creates cert + profile if missing)
        # app-store-connect auto-reads APP_STORE_CONNECT_ISSUER_ID /
        # _KEY_IDENTIFIER / _PRIVATE_KEY from the environment.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//') \
            --build-number=$(($(date +%s)/60)) \
            --dart-define=CARE_API_BASE=https://ecare.care-kw.com/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Flip to true once TestFlight looks good, to auto-submit for review:
        submit_to_app_store: false

  android-play:
    name: CARE Android → Google Play (optional)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      android_signing:
        - care_upload            # the care-release.jks uploaded in Codemagic
      groups:
        - google_play
      flutter: stable
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//') \
            --build-number=$(($(date +%s)/60)) \
            --dart-define=CARE_API_BASE=https://ecare.care-kw.com/api/v1
    artifacts:
      - build/**/outputs/bundle/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
