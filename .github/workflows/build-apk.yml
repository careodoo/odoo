name: Build Android APK

# Builds a release APK in the cloud (no local Flutter/Android SDK needed) and
# attaches it to a GitHub Release you can download straight onto a phone.
on:
  push:
    branches: [care-mobile-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show versions
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.carekw --project-name care_mobile .

      - name: Add camera + internet permissions
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = ('\n    <uses-permission android:name="android.permission.INTERNET"/>'
                   '\n    <uses-permission android:name="android.permission.CAMERA"/>'
                   '\n    <uses-permission android:name="android.permission.NFC"/>')
          # Insert right after the opening <manifest ...> tag (newline-agnostic).
          if "android.permission.INTERNET" not in s or "android.permission.CAMERA" not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1' + perms, s, count=1)
          # app display name shown under the icon
          s = re.sub(r'android:label="[^"]*"', 'android:label="CARE FM"', s, count=1)
          p.write_text(s)
          assert "android.permission.INTERNET" in p.read_text(), "INTERNET permission not added!"
          print(p.read_text()[:700])
          PY

      - name: Force compileSdk 36 (nfc_manager needs >=34)
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true

      - name: Configure stable release signing (so upgrades install over old app)
        run: |
          cp ci/care_release.keystore android/app/care_release.keystore
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          s = p.read_text()
          sign = ('    signingConfigs {\n'
                  '        create("release") {\n'
                  '            storeFile = file("care_release.keystore")\n'
                  '            storePassword = "carefm2026"\n'
                  '            keyAlias = "carefm"\n'
                  '            keyPassword = "carefm2026"\n'
                  '        }\n'
                  '    }\n'
                  '    buildTypes {')
          if 'create("release")' not in s:
              s = s.replace("buildTypes {", sign, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          print("signing configured:", 'create("release")' in p.read_text())
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (CARE FM)
        run: dart run flutter_launcher_icons || true

      - name: Bump nfc_manager compileSdk (it pins 31, AndroidX needs >=34)
        run: find ~/.pub-cache -path "*nfc_manager*/android/build.gradle" -exec sed -i 's/compileSdkVersion 31/compileSdkVersion 34/' {} + || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=CARE_API_BASE=https://ecare.care-kw.com/api/v1 \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk care-mobile-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: care-mobile-apk
          path: care-mobile-${{ github.run_number }}.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.0-${{ github.run_number }}
          name: Care Mobile APK build ${{ github.run_number }}
          files: care-mobile-${{ github.run_number }}.apk
          body: |
            APK جاهز للتثبيت على أندرويد (release).
            الخادم: https://ecare.care-kw.com/api/v1
            دخول تجريبي: cafmtest / cafm12345
