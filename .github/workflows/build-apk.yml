name: Build Android APK

# Builds a release APK in the cloud (no local Flutter/Android SDK needed) and
# attaches it to a GitHub Release you can download straight onto a phone.
on:
  push:
    branches: [care-mobile-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # PINNED: 'stable' with no version auto-updated to a newer Flutter after
          # 2026-07-16 that broke `flutter build apk` — every CI run since then
          # failed at that step (no releases past build 87). 3.44.6 is the version
          # that builds cleanly locally; keep it pinned.
          flutter-version: 3.44.6

      - name: Show versions
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.carekw --project-name care_mobile .

      - name: Add camera + internet permissions
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = ('\n    <uses-permission android:name="android.permission.INTERNET"/>'
                   '\n    <uses-permission android:name="android.permission.CAMERA"/>'
                   '\n    <uses-permission android:name="android.permission.NFC"/>')
          # Insert right after the opening <manifest ...> tag (newline-agnostic).
          if "android.permission.INTERNET" not in s or "android.permission.CAMERA" not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1' + perms, s, count=1)
          # app display name shown under the icon
          s = re.sub(r'android:label="[^"]*"', 'android:label="CARE FM"', s, count=1)
          p.write_text(s)
          assert "android.permission.INTERNET" in p.read_text(), "INTERNET permission not added!"
          print(p.read_text()[:700])
          PY

      - name: Force compileSdk 36 (nfc_manager needs >=34)
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true

      - name: Configure release signing (CONSISTENT key so upgrades install + Play accepts)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # The committed android/app/build.gradle.kts already signs from
          # android/key.properties → android/care-release.jks. We only need to
          # PROVIDE those two files. Previously CI had neither, so it fell back
          # to an EPHEMERAL debug key that changed every run — different
          # fingerprint each build, so no APK could upgrade over another and
          # Play rejected them. Never let that happen again.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/care-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=care-release.jks\n' \
              "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "✅ Signing with the Play UPLOAD key from the RELEASE_KEYSTORE_B64 secret."
          else
            echo "⚠️  RELEASE_KEYSTORE_B64 secret is NOT set — falling back to the committed"
            echo "    ci/care_release.keystore (consistent, but NOT the Play key)."
            cp ci/care_release.keystore android/care-release.jks
            printf 'storePassword=carefm2026\nkeyPassword=carefm2026\nkeyAlias=carefm\nstoreFile=care-release.jks\n' > android/key.properties
          fi
          echo "storeFile fingerprint:"
          keytool -list -keystore android/care-release.jks \
            -storepass "$(grep storePassword android/key.properties | cut -d= -f2)" 2>/dev/null | grep -i SHA1 || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons (CARE FM)
        run: dart run flutter_launcher_icons || true

      - name: Bump nfc_manager compileSdk (it pins 31, AndroidX needs >=34)
        run: find ~/.pub-cache -path "*nfc_manager*/android/build.gradle" -exec sed -i 's/compileSdkVersion 31/compileSdkVersion 34/' {} + || true

      - name: Read app version from pubspec
        id: ver
        run: |
          # "3.7.0+2124" → name 3.7.0 ; the build-number stays the run number so
          # the Android versionCode always increases no matter what.
          VNAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "App version: $VNAME (build ${{ github.run_number }})"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=${{ steps.ver.outputs.name }} \
            --dart-define=CARE_API_BASE=https://ecare.care-kw.com/api/v1 \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Build release App Bundle (.aab for Google Play)
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --build-name=${{ steps.ver.outputs.name }} \
            --dart-define=CARE_API_BASE=https://ecare.care-kw.com/api/v1 \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk care-mobile-v${{ steps.ver.outputs.name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab care-mobile-v${{ steps.ver.outputs.name }}.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: care-mobile-build
          path: |
            care-mobile-v${{ steps.ver.outputs.name }}.apk
            care-mobile-v${{ steps.ver.outputs.name }}.aab

      - name: Publish Release with APK + AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: CARE Mobile v${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          files: |
            care-mobile-v${{ steps.ver.outputs.name }}.apk
            care-mobile-v${{ steps.ver.outputs.name }}.aab
          body: |
            **CARE Mobile v${{ steps.ver.outputs.name }}** — build ${{ github.run_number }}

            📱 `care-mobile-v${{ steps.ver.outputs.name }}.apk` — تثبيت مباشر على أندرويد (release)
            📦 `care-mobile-v${{ steps.ver.outputs.name }}.aab` — للرفع على Google Play

            الخادم: https://ecare.care-kw.com/api/v1
