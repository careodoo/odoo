<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CARE CAFM — بوابة إدارة المرافق</title>
<style>
  @font-face{font-family:'Tajawal';font-weight:400;src:url('/care_arabic_font/static/fonts/Tajawal-400.ttf') format('truetype')}
  @font-face{font-family:'Tajawal';font-weight:500;src:url('/care_arabic_font/static/fonts/Tajawal-500.ttf') format('truetype')}
  @font-face{font-family:'Tajawal';font-weight:700;src:url('/care_arabic_font/static/fonts/Tajawal-700.ttf') format('truetype')}
  @font-face{font-family:'Tajawal';font-weight:800;src:url('/care_arabic_font/static/fonts/Tajawal-800.ttf') format('truetype')}
  :root{
    /* CARE identity — the same tokens the app uses, so the two read as one
       system instead of two products that happen to share data. */
    --nav:#1b1416; --nav2:#120c0e; --accent:#c0392b; --accent-d:#8e241b;
    --accent-l:#e24a3b;
    --teal:#0ea5a4; --blue:#3b82f6; --amber:#f59e0b; --green:#16a34a; --red:#e11d48; --purple:#7c3aed; --cyan:#0891b2;
    --ink:#14202b; --muted:#64748b; --line:#e6eaf0; --line2:#eef3f9; --bg:#f4f6fa; --card:#fff;
    --sb:256px; --radius:16px; --shadow:0 4px 20px rgba(15,33,55,.06); --shadow-lg:0 18px 50px rgba(15,33,55,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Tajawal',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cdd8e6;border-radius:8px}
  /* ---------- login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;
    background:radial-gradient(1100px 560px at 82% -12%,rgba(255,255,255,.16),transparent),
               linear-gradient(150deg,var(--accent-l),var(--accent) 45%,#7a1b14)}
  #login::before{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 30px)}
  #login .card{background:#fff;border-radius:22px;padding:38px 34px;width:380px;max-width:92vw;box-shadow:var(--shadow-lg);text-align:center}
  #login img{max-width:200px;margin-bottom:6px}
  #login h2{margin:8px 0 22px;font-size:16px;color:var(--muted);font-weight:600}
  #login .fld{position:relative;margin-bottom:14px}
  #login input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;transition:border .15s}
  #login input:focus{outline:none;border-color:var(--accent)}
  #login button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(192,57,43,.32)}
  #login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
  /* ---------- shell ---------- */
  #app{display:none}
  #login{display:none}
  #splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,var(--nav),var(--nav2))}
  #splash img{max-width:150px;filter:brightness(0) invert(1);opacity:.95}
  #splash .sp{width:40px;height:40px;border:4px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:var(--sb);background:linear-gradient(180deg,var(--nav),var(--nav2));
    color:#c3d1e6;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
  .sidebar .brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
  .sidebar .brand img{max-width:132px;filter:brightness(0) invert(1)}
  .sidebar .brand b{font-size:19px;letter-spacing:1px;color:#fff}
  .nav{flex:1;overflow-y:auto;padding:8px 10px}
  .nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
  .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12)}
  .nav .grp{padding:16px 20px 6px;font-size:10.5px;letter-spacing:.6px;color:#6f83a3;font-weight:800;text-transform:uppercase}
  .nav .grp{padding:15px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 0;font-size:13.5px;font-weight:600;color:#c3d1e6;cursor:pointer;border-radius:10px;transition:.13s;position:relative}
  .nav a .ic{width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.06);border-radius:8px;flex:0 0 auto;opacity:.95}
  .nav a .cnt{margin-inline-start:auto;background:rgba(255,255,255,.14);color:#e6eefb;border-radius:20px;font-size:10.5px;padding:1px 8px;font-weight:800;min-width:20px;text-align:center}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav a.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(230,41,92,.34)}
  .nav a.on .ic{background:rgba(255,255,255,.2)}
  .nav a.on .cnt{background:rgba(255,255,255,.24)}
  /* service accordion */
  .nav .svc{margin:2px 0}
  .nav .svc-h{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#e2ecfa;font-weight:800;font-size:13.5px;transition:.12s;user-select:none}
  .nav .svc-h:hover{background:rgba(255,255,255,.06)}
  .nav .svc-ic{width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .nav .svc-cnt{margin-inline-start:auto;background:rgba(255,255,255,.16);border-radius:20px;font-size:10.5px;padding:1px 8px;font-weight:800}
  .nav .svc-chev{font-size:10px;opacity:.6;margin-inline-start:6px;transition:.2s}
  .nav .svc.col .svc-chev{transform:rotate(-90deg)}
  .nav .svc-items{padding-inline-start:12px;margin:2px 0 4px 13px;border-inline-start:1.5px solid rgba(255,255,255,.1)}
  html[dir=rtl] .nav .svc-items{margin:2px 13px 4px 0}
  .nav .svc.col .svc-items{display:none}
  .nav .svc-items a{font-size:12.5px;padding:7px 10px}
  .nav .svc-items a .ic{width:22px;height:22px;font-size:12.5px}
  .sidebar .foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#7f93b3;display:flex;align-items:center;gap:8px}
  .main{margin-inline-start:var(--sb);min-height:100vh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;gap:14px;z-index:20}
  .top .burger{display:none;font-size:22px;cursor:pointer;background:none;border:0}
  .top .crumb{flex:1}
  .top .crumb h1{font-size:18px;margin:0;font-weight:800}
  .top .crumb .sub{font-size:12px;color:var(--muted)}
  .search{position:relative;width:260px;max-width:32vw}
  .search input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:13px;background:#f7fafd}
  .search input:focus{outline:none;border-color:var(--blue);background:#fff}
  .search .sic{position:absolute;inset-inline-end:11px;top:9px;color:var(--muted)}
  .search .res{position:absolute;top:44px;inset-inline-start:0;inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;display:none;z-index:40}
  .search .res a{display:block;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
  .search .res a:hover{background:#f4f8fd}
  .iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
  .iconbtn:hover{background:#f4f8fd}
  .iconbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--accent);color:#fff;border-radius:12px;font-size:10px;padding:1px 5px;font-weight:800}
  .user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 6px;border-radius:12px}
  .user:hover{background:#f4f8fd}
  .user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--nav),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .user .nm{font-size:13px;font-weight:700} .user .rl{font-size:11px;color:var(--muted)}
  .page{padding:22px 24px;flex:1}
  /* ---------- components ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .kpi{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .kpi .top{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;position:static}
  .kpi .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
  .kpi .v{font-size:25px;font-weight:800;line-height:1}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:3px}
  .kpi .bar{position:absolute;inset-inline-start:0;bottom:0;height:3px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g23{grid-template-columns:2fr 1fr}
  @media(max-width:1050px){.g2,.g3,.g23{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .panel .ph h3{margin:0;font-size:14.5px;font-weight:800;flex:1}
  .panel .ph .act{font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:700}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .chip{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff;border:1px solid var(--line);color:#475569;user-select:none}
  .chip.on{background:var(--nav);border-color:var(--nav);color:#fff}
  select.inp,input.inp,textarea.inp{padding:9px 12px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
  select.inp:focus,input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--blue)}
  .btn{padding:9px 16px;border:0;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.p{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 6px 16px rgba(230,41,92,.25)}
  .btn.g{background:var(--green);color:#fff} .btn.b{background:var(--blue);color:#fff}
  .btn.s{background:#eef2f7;color:#334} .btn.d{background:#fde8ec;color:var(--red)}
  .btn:disabled{opacity:.55;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:start;padding:11px 10px;color:var(--muted);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--line);position:sticky;top:0;background:#fff}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line2)}
  tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:#f4f8fd}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;white-space:nowrap}
  .dotpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
  .dotpill i{width:8px;height:8px;border-radius:50%}
  .prio{font-weight:800;font-size:11px}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#e7effe;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue);font-size:14px;vertical-align:middle}
  .muted{color:var(--muted)} .center{text-align:center;padding:40px;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid #dbe6f2;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)} .empty .em{font-size:40px;opacity:.5}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
  .bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
  .bars .bk{width:66%;border-radius:7px 7px 0 0;min-height:3px;transition:height .5s}
  .bars .cap{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bars .nm{font-size:12px;font-weight:800}
  .tree .node{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .tree .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:#fff}
  .tree .hd:hover{background:#f7fafd}
  .tree .kids{padding:0 14px 8px 30px;display:none}
  .tree .node.open>.kids{display:block}
  .tree .chev{transition:.2s;color:var(--muted)} .tree .node.open>.hd .chev{transform:rotate(90deg)}
  .alert{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;margin-bottom:8px;font-size:13px;font-weight:600}
  .alert.r{background:#fff1f3;color:#b4123a} .alert.a{background:#fff8ec;color:#a05a05} .alert.g{background:#eefaf2;color:#12703f}
  /* drawer */
  /* ---------- dialogs ----------
     Every dialog in the portal goes through openDrawer(), so this container is
     the dialog system. A centred card on a desktop (where a full-height rail
     wastes the screen and buries the actions below the fold) and a bottom sheet
     on a phone, which is where a thumb already expects one. */
  #scrim{position:fixed;inset:0;z-index:44;display:none;opacity:0;transition:opacity .22s;
    background:radial-gradient(900px 500px at 50% 0%,rgba(120,20,12,.30),rgba(10,18,30,.58));
    backdrop-filter:blur(3px)}
  #scrim.show{display:block;opacity:1}
  #drawer{position:fixed;z-index:45;display:flex;flex-direction:column;background:var(--card);
    inset-inline-start:50%;top:50%;width:min(720px,94vw);max-height:88vh;
    transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;
    border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(10,18,30,.34);
    transition:opacity .2s ease,transform .24s cubic-bezier(.2,.8,.25,1)}
  html[dir=rtl] #drawer{transform:translate(50%,-46%) scale(.97)}
  #drawer.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  html[dir=rtl] #drawer.show{transform:translate(50%,-50%) scale(1)}
  #drawer.sm{width:min(460px,94vw)} #drawer.lg{width:min(1020px,96vw)}
  /* the header carries the accent so a dialog reads as part of CARE, not a
     browser default floating over it */
  #drawer .dh{display:flex;align-items:center;gap:12px;padding:16px 20px;position:relative;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;flex:0 0 auto}
  #drawer .dh::after{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px)}
  #drawer .dh .dic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;z-index:1}
  #drawer .dh .dtx{flex:1;min-width:0;z-index:1}
  #drawer .dh b{display:block;font-size:16px;font-weight:800;line-height:1.35}
  #drawer .dh .dsub{font-size:11.5px;opacity:.85;margin-top:1px}
  #drawer .dh .iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;
    border-radius:10px;font-size:16px;z-index:1}
  #drawer .dh .iconbtn:hover{background:rgba(255,255,255,.28)}
  #drawer .db{padding:18px 20px;overflow:auto;flex:1;background:var(--bg)}
  /* actions live on a sticky footer instead of scrolling away with the body */
  #drawer .df{display:flex;gap:9px;justify-content:flex-end;align-items:center;flex:0 0 auto;
    padding:12px 18px;background:var(--card);border-top:1px solid var(--line)}
  #drawer .df .spacer{flex:1}
  #drawer .db>.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  #drawer .db>.sec>h4{margin:0 0 10px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  @media(max-width:760px){
    #drawer,html[dir=rtl] #drawer{inset-inline-start:0;inset-inline-end:0;top:auto;bottom:0;
      width:100%;max-width:100%;max-height:92vh;border-radius:22px 22px 0 0;
      transform:translateY(14%) scale(1)}
    #drawer.show,html[dir=rtl] #drawer.show{transform:translateY(0) scale(1)}
    #drawer .dh::before{content:'';position:absolute;top:7px;inset-inline-start:50%;
      transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
  }
  @media(prefers-reduced-motion:reduce){#drawer{transition:opacity .01s}}
  /* ---------- command palette ---------- */
  #cmdk{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;
    padding-top:12vh;background:rgba(10,18,30,.5);backdrop-filter:blur(4px)}
  #cmdk.show{display:flex}
  #cmdk .box{width:min(600px,94vw);background:var(--card);border-radius:18px;overflow:hidden;
    box-shadow:0 30px 90px rgba(10,18,30,.4)}
  #cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 20px;
    font-family:inherit;font-size:15.5px;font-weight:700;color:var(--ink)}
  #cmdk input:focus{outline:none}
  #cmdk .list{max-height:52vh;overflow:auto;padding:6px}
  #cmdk .it{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600}
  #cmdk .it .ic{width:28px;height:28px;border-radius:8px;background:#f1f5fa;display:flex;align-items:center;justify-content:center}
  #cmdk .it.on,#cmdk .it:hover{background:var(--accent);color:#fff}
  #cmdk .it.on .ic,#cmdk .it:hover .ic{background:rgba(255,255,255,.2)}
  #cmdk .it .kb{margin-inline-start:auto;font-size:10.5px;opacity:.6}
  #cmdk .hint{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:14px}
  .kv{width:100%;font-size:13px} .kv td{padding:7px 4px;border-bottom:1px solid var(--line2)} .kv td:first-child{color:var(--muted);width:120px}
  .sec-t{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px}
  .media-grid{display:flex;gap:8px;flex-wrap:wrap}
  .media-grid a{position:relative;display:block} .media-grid img{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--line);transition:.15s} .media-grid a:hover img{transform:scale(1.04);box-shadow:0 6px 16px rgba(15,23,42,.18)}
  .ev-th{display:inline-flex;align-items:center;justify-content:center;position:relative;width:34px;height:34px;border-radius:8px;background-size:cover;background-position:center;background-color:#eef2f7;border:1px solid var(--line)}
  .ev-pl{color:#fff;font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .ev-b{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;background:#eef2f7;color:#475569;border-radius:20px;padding:2px 7px}
  .ev-b.ok{background:#e7f7ee;color:#12703f}
  /* live ops board */
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

function applyDir(){document.documentElement.lang=LANG;document.documentElement.dir=(LANG==='ar'?'rtl':'ltr');

  const S=(id,ar,en,attr)=>{const e=document.getElementById(id);if(e){if(attr)e.setAttribute(attr,T(ar,en));else e.textContent=T(ar,en);}};
  S('loginH2','بوابة إدارة المرافق','Facility Management Portal');

function setLang(l){LANG=l;localStorage.setItem('carefm_lang',l);applyDir();renderNav();updateCounts();go(CUR);}

const dday = s => s? String(s).split('T')[0]:'—';
let PROJECT=localStorage.getItem('carefm_project')||'all';
async function api(path,{method='GET',body=null,raw=false}={}){
  // scope client GET reads to the selected project (header selector)
  if(PROJECT&&PROJECT!=='all'&&method==='GET'&&path.indexOf('/client/')===0){path+=(path.indexOf('?')>=0?'&':'?')+'project_id='+encodeURIComponent(PROJECT);}
  const h={'Content-Type':'application/json'}; if(TOKEN) h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):null});
  if(raw) return r;
  const j=await r.json().catch(()=>({ok:false,error:'استجابة غير صالحة'}));
  if(!r.ok||j.ok===false) throw new Error(j.error||('خطأ '+r.status));
  return j.data!==undefined?j.data:j;
}

function donut(parts,size,label){size=size||140;const r=size/2-14,c=2*Math.PI*r,cx=size/2;let off=0,tot=parts.reduce((s,p)=>s+p.v,0)||1,seg='';
  parts.forEach(p=>{const l=c*p.v/tot;seg+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="15" stroke-linecap="round" stroke-dasharray="'+Math.max(0,l-1.5)+' '+(c-l+1.5)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cx+')"/>';off+=l;});
  const mid=label!==undefined?label:(parts[0]?Math.round(100*parts[0].v/tot)+'%':'0');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#eef2f7" stroke-width="15"/>'+seg+'<text x="'+cx+'" y="'+(cx+2)+'" text-anchor="middle" font-size="21" font-weight="800" fill="#14202b" font-family="Tajawal">'+mid+'</text><text x="'+cx+'" y="'+(cx+20)+'" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="Tajawal">'+esc(parts.__sub||'')+'</text></svg>';}
function gauge(pct,color){pct=Math.max(0,Math.min(100,pct));color=color||'#16a34a';const r=54,cx=64,cy=64,c=Math.PI*r;const l=c*pct/100;
  return '<svg width="128" height="80" viewBox="0 0 128 80"><path d="M10 64 A54 54 0 0 1 118 64" fill="none" stroke="#eef2f7" stroke-width="13" stroke-linecap="round"/><path d="M10 64 A54 54 0 0 1 118 64" fill="none" stroke="'+color+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+l+' '+c+'"/><text x="64" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#14202b" font-family="Tajawal">'+Math.round(pct)+'%</text></svg>';}
function barsChart(items){const mx=Math.max(1,...items.map(i=>i.v));return '<div class="bars">'+items.map(i=>'<div class="col"><div class="nm num" style="color:'+(i.c||'#0ea5a4')+'">'+i.v+'</div><div class="bk" style="height:'+(100*i.v/mx)+'%;background:linear-gradient(180deg,'+(i.c||'#14b8a6')+','+(i.c2||'#0b8f86')+')"></div><div class="cap" title="'+esc(i.l)+'">'+esc(i.l)+'</div></div>').join('')+'</div>';}
function areaChart(points,color){color=color||'#3b82f6';const w=560,h=120,pad=6;const mx=Math.max(1,...points.map(p=>p.v));const n=points.length;
  const X=i=>pad+i*(w-2*pad)/Math.max(1,n-1);const Y=v=>h-pad-(v/mx)*(h-2*pad);
  let d='M'+X(0)+' '+Y(points[0].v);points.forEach((p,i)=>{if(i)d+=' L'+X(i)+' '+Y(p.v);});
  const area=d+' L'+X(n-1)+' '+h+' L'+X(0)+' '+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:120px"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#ag)"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/></svg>';}
function spark(vals,color){color=color||'#16a34a';const w=90,h=26,mx=Math.max(1,...vals);let d='';vals.forEach((v,i)=>{d+=(i?' L':'M')+(i*w/Math.max(1,vals.length-1)).toFixed(1)+' '+(h-2-(v/mx)*(h-4)).toFixed(1);});return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/></svg>';}

const __PG={};
function pagedTable(hostId,rows,headHtml,rowFn,key,rerender,pageSize){
  pageSize=pageSize||15;const st=__PG[key]||(__PG[key]={page:1});st.rerender=rerender;st.rows=rows;st.head=headHtml;st.rowFn=rowFn;st.host=hostId;st.size=pageSize;
  const total=rows.length,pages=Math.max(1,Math.ceil(total/pageSize));if(st.page>pages)st.page=pages;if(st.page<1)st.page=1;
  const start=(st.page-1)*pageSize,slice=rows.slice(start,start+pageSize);
  const host=document.getElementById(hostId);if(!host)return;
  const cnt='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px"><span class="muted" style="font-size:12px">'+T('إجمالي السجلات','Total')+': <b>'+total+'</b></span>'+(pages>1?'<span class="muted" style="font-size:12px">'+(total?(start+1)+'–'+(start+slice.length):0)+' / '+total+'</span>':'')+'</div>';
  const nav=pages>1?'<div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px"><button class="btn s" '+(st.page<=1?'disabled':'')+' onclick="__pg(\''+key+'\',1)">«</button><button class="btn s" '+(st.page<=1?'disabled':'')+' onclick="__pg(\''+key+'\','+(st.page-1)+')">‹</button><span class="chip on">'+st.page+' / '+pages+'</span><button class="btn s" '+(st.page>=pages?'disabled':'')+' onclick="__pg(\''+key+'\','+(st.page+1)+')">›</button><button class="btn s" '+(st.page>=pages?'disabled':'')+' onclick="__pg(\''+key+'\','+pages+')">»</button></div>':'';
  host.innerHTML=cnt+(total?'<table>'+headHtml+'<tbody>'+slice.map(rowFn).join('')+'</tbody></table>'+nav:emptyState(T('لا سجلات','No records')));
}
function __pg(key,page){const st=__PG[key];if(!st)return;st.page=page;pagedTable(st.host,st.rows,st.head,st.rowFn,key,st.rerender,st.size);}
function pgReset(key){if(__PG[key])__PG[key].page=1;}
// ---------- drawer ----------
/* ---- dialogs ----
   Every dialog in the portal comes through here, so an option added once is an
   option every dialog gains. The signature stays (title,html) — the third
   argument is optional so no existing call had to change:
     {icon, subtitle, size:'sm'|'lg', actions:[{label,cls,onclick,icon}]}      */
function openDrawer(title,html,opt){opt=opt||{};
  const d=document.getElementById('drawer');
  d.classList.remove('sm','lg'); if(opt.size)d.classList.add(opt.size);
  document.getElementById('dicon').textContent=opt.icon||'📄';
  const s=document.getElementById('dsub');
  s.textContent=opt.subtitle||''; s.style.display=opt.subtitle?'block':'none';
  document.getElementById('dtitle').textContent=title;
  document.getElementById('dbody').innerHTML=html;
  drawerActions(opt.actions);
  document.getElementById('scrim').classList.add('show');
  d.classList.add('show');
  setTimeout(()=>{const f=d.querySelector('.db input,.db select,.db textarea');if(f)f.focus();},80);
}
/* Buttons live on the sticky footer so they never scroll out of reach — the
   commonest complaint about a long form in a dialog. */
function drawerActions(actions){const f=document.getElementById('dfoot');
  if(!actions||!actions.length){f.style.display='none';f.innerHTML='';return;}
  f.innerHTML='<span class="spacer"></span>'+actions.map((a,i)=>
    '<button class="btn '+(a.cls||'s')+'" onclick="__dact('+i+')">'+
    (a.icon?esc(a.icon)+' ':'')+esc(a.label)+'</button>').join('');
  f.__acts=actions; f.style.display='flex';
}
function __dact(i){const f=document.getElementById('dfoot');const a=(f.__acts||[])[i];
  if(a&&typeof a.onclick==='function')a.onclick(); else if(a&&a.onclick)eval(a.onclick);}
function setDrawer(title,html,opt){openDrawer(title,html,opt);}
function closeDrawer(){document.getElementById('scrim').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  drawerActions(null);}
/* A confirm that matches the rest of the portal instead of the browser's, and
   that can say what is about to happen rather than just "OK / Cancel". */
function confirmDialog(title,message,onYes,opt){opt=opt||{};
  openDrawer(title,'<div class="sec" style="font-size:14px;line-height:1.7">'+esc(message)+'</div>',
    {icon:opt.icon||'⚠️',size:'sm',subtitle:opt.subtitle,
     actions:[{label:T('إلغاء','Cancel'),cls:'s',onclick:closeDrawer},
              {label:opt.yes||T('تأكيد','Confirm'),cls:opt.danger?'d':'p',
               onclick:function(){closeDrawer();onYes&&onYes();}}]});
}
/* ---- command palette ----
   The sidebar keeps growing as services are added; typing the name of a page
   beats hunting for it. */
let CMD_IDX=0,CMD_HITS=[];
/* Read the sidebar itself rather than a second list of pages — a service added
   to the nav is searchable the same day, with no list to keep in step. Some
   entries call goSvc() rather than go(), so the anchor is clicked, not guessed. */
function cmdItems(){const out=[];
  document.querySelectorAll('#nav a[data-id]').forEach(a=>{
    const ic=a.querySelector('.ic'),cnt=a.querySelector('.cnt');
    let label='';a.querySelectorAll('span').forEach(s=>{if(s!==ic&&s!==cnt)label+=s.textContent;});
    label=label.trim()||a.textContent.trim();
    const grp=a.closest('.svc');
    const scope=grp?(grp.querySelector('.svc-h')||{}).textContent:'';
    out.push({label:label,scope:(scope||'').trim(),icon:(ic?ic.textContent:'')||'•',el:a});});
  return out.filter(i=>i.label);
}
function openCmd(){document.getElementById('cmdk').classList.add('show');
  const q=document.getElementById('cmdq');q.value='';cmdRender('');setTimeout(()=>q.focus(),40);}
function closeCmd(){document.getElementById('cmdk').classList.remove('show');}
function cmdRender(term){term=(term||'').trim().toLowerCase();
  CMD_HITS=cmdItems().filter(i=>!term||i.label.toLowerCase().includes(term)
                                 ||(i.scope||'').toLowerCase().includes(term)).slice(0,40);
  CMD_IDX=0;
  const l=document.getElementById('cmdlist');
  l.innerHTML=CMD_HITS.length?CMD_HITS.map((i,n)=>
    '<div class="it'+(n===0?' on':'')+'" onclick="cmdGo('+n+')"><span class="ic">'+esc(i.icon)+
    '</span><span>'+esc(i.label)+'</span>'+
    (i.scope?'<span class="kb">'+esc(i.scope)+'</span>':'')+'</div>').join('')
    :'<div style="padding:24px;text-align:center;color:var(--muted)">'+T('لا نتائج','No matches')+'</div>';
}
function cmdMove(d){if(!CMD_HITS.length)return;CMD_IDX=(CMD_IDX+d+CMD_HITS.length)%CMD_HITS.length;
  const els=document.querySelectorAll('#cmdlist .it');
  els.forEach((e,n)=>e.classList.toggle('on',n===CMD_IDX));
  if(els[CMD_IDX])els[CMD_IDX].scrollIntoView({block:'nearest'});}
function cmdGo(n){const it=CMD_HITS[n];if(!it||!it.el)return;closeCmd();it.el.click();}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return;}
  const cmd=document.getElementById('cmdk');
  if(cmd&&cmd.classList.contains('show')){
    if(e.key==='Escape'){closeCmd();}
    else if(e.key==='ArrowDown'){e.preventDefault();cmdMove(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdMove(-1);}
    else if(e.key==='Enter'){e.preventDefault();cmdGo(CMD_IDX);}
    return;
  }
  if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('show'))closeDrawer();
});

function goSvc(base,type){window.__PRESVC=type;go(base,base+'_'+type);}
function toggleSvc(t){const el=document.querySelector('.svc[data-svc="'+CSS.escape(t)+'"]');if(el)el.classList.toggle('col');}

/* The service's name in the language the reader chose, not the one their Odoo
   account happens to use — the server now sends both. */
function svcName(s){
  if(!s) return '';
  const ar = s.name_ar || s.type_label_ar || s.name;
  const en = s.name_en || s.type_label_en || s.type_label || s.name;
  return T(ar, en);
}
function renderNav(){
  let html=NAV_MAIN.map(x=>x.grp?'<div class="grp">'+esc(T(x.grp[0],x.grp[1]))+'</div>':navAnchor(x)).join('');
  // ---- one collapsible group per available service ----
  if(SERVICES.length){
    html+='<div class="grp">'+esc(T('الخدمات المتعاقَدة','Contracted services'))+'</div>';
    SERVICES.forEach((s,i)=>{
      const col=SVC_COLORS[s.type]||'#64748b';
      const items=s.type==='waste'
        ? [{id:'waste_dash',ic:'📊',t:['لوحة النفايات','Waste dashboard']},{id:'waste_overview',ic:'♻️',t:['أوامر النقل','Collection orders']},{id:'waste_trips',ic:'🚛',t:['الرحلات','Trips']}].map(it=>navAnchor(it)).join('')
        : s.type==='security'
        ? SEC_ITEMS.map(it=>navAnchor(it)).join('')
        : s.type==='cleaning'
        ? CLEAN_ITEMS.map(it=>navAnchor(it)).join('')
          +'<a data-id="workorders_'+s.type+'" onclick="goSvc(\'workorders\',\''+s.type+'\')"><span class="ic">🧾</span><span>'+esc(T('أوامر العمل','Work orders'))+'</span></a>'
        : s.type==='facade'
        ? FACADE_ITEMS.map(it=>navAnchor(it)).join('')
          +'<a data-id="workorders_'+s.type+'" onclick="goSvc(\'workorders\',\''+s.type+'\')"><span class="ic">🧾</span><span>'+esc(T('أوامر العمل','Work orders'))+'</span></a>'
        : (s.type==='agriculture'||s.type==='landscape')
        ? AGRI_ITEMS.map(it=>navAnchor(it)).join('')
          +'<a data-id="workorders_'+s.type+'" onclick="goSvc(\'workorders\',\''+s.type+'\')"><span class="ic">🧾</span><span>'+esc(T('أوامر العمل','Work orders'))+'</span></a>'
        : svcRegItems(s.type)
          +'<a data-id="workorders_'+s.type+'" onclick="goSvc(\'workorders\',\''+s.type+'\')"><span class="ic">🧾</span><span>'+esc(T('أوامر العمل','Work orders'))+'</span></a>'
          +'<a data-id="quality_'+s.type+'" onclick="goSvc(\'quality\',\''+s.type+'\')"><span class="ic">✅</span><span>'+esc(T('الجودة والجولات','Quality & rounds'))+'</span></a>'
          +(s.type==='maintenance'?'<a data-id="ppm" onclick="go(\'ppm\')"><span class="ic">🔧</span><span>'+esc(T('الصيانة الوقائية','Preventive maint.'))+'</span></a>':'');
      const col_cls=' col';   // all services collapsed by default

   Until now the nav had a hand-written branch per service, and every service
   added after those branches were written fell through to a bare "work orders

   control saw, functionally, nothing. The backend already declares what each
   service is made of, so read that instead of maintaining a second list here. */
let SVC_REG={};
async function loadSvcReg(){try{const d=await api('/client/svc');
  (d.services||[]).forEach(s=>{SVC_REG[s.code]=s;});}catch(e){SVC_REG={};}}
function svcRegItems(type){const reg=SVC_REG[type];
  if(!reg||!reg.sections||!reg.sections.length)return '';
  return reg.sections.map(sec=>
    '<a data-id="svc:'+esc(type)+':'+esc(sec.key)+'" onclick="goSvcSec(\''+type+'\',\''+sec.key+'\')">'
    +'<span class="ic">'+esc(sec.icon||'•')+'</span><span>'+esc(T(sec.label, sec.label_en||sec.label))+'</span></a>').join('');
}
function goSvcSec(code,key,page){SVC_PAGE=page||1;go('svc:'+code+':'+key);}
let SVC_PAGE=1;
/* One renderer for every service section — 11 services, 39 sub-sections. A
   section added to the registry appears here with no code written for it. */
async function renderSvcSection(code,key){
  const host=document.getElementById('page');
  host.innerHTML='<div class="spin"></div>';
  let d;
  try{d=await api('/client/svc/'+encodeURIComponent(code)+'/'+encodeURIComponent(key)+'?page='+(SVC_PAGE||1));}
  catch(e){host.innerHTML=emptyState(T('تعذّر التحميل','Could not load'));return;}
  const sec=d.section||{},svc=d.service||{};
  SVC_MODEL[code+':'+key]=sec.model||'';
  SVC_CANCEL[code+':'+key]=!!d.can_cancel;
  document.getElementById('ptitle').textContent=T(sec.label||'', sec.label_en||sec.label||'');
  document.getElementById('psub').textContent=T(svc.label||'', svc.label_en||svc.label||'');
  let h='<div class="toolbar">';
  if(d.can_add)h+='<button class="btn p" onclick="svcAddForm(\''+code+'\',\''+key+'\')">＋ '+esc(T(d.add_label||'إضافة', d.add_label_en||'Add'))+'</button>';
  h+='<span style="color:var(--muted);font-size:12.5px">'+esc(T('السجلات','Records'))+': <b class="num">'+(d.total||0)+'</b></span></div>';
  if(!(d.rows||[]).length){host.innerHTML=h+emptyState(sec.empty||T('لا توجد سجلات','No records'));return;}
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">';
  SVC_ROWS[code+':'+key]=d.rows||[];
  h+=(d.rows||[]).map((r,ix)=>'<div class="panel" style="padding:14px;cursor:pointer" '
    +'onclick="svcOpenRow(\''+code+'\',\''+key+'\','+ix+')">'
    +'<div style="font-weight:800;font-size:14px;margin-bottom:3px">'+esc(r.title)+'</div>'
    +(r.subtitle?'<div style="color:var(--muted);font-size:12px;margin-bottom:8px">'+esc(r.subtitle)+'</div>':'')
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +(r.pills||[]).map(p=>pillHtml(p.t,p.c)).join('')+'</div>'
    +'<div style="margin-top:10px;display:flex;gap:7px"><button class="btn s" style="font-size:11.5px;padding:6px 11px" '
    +'onclick="svcReport(\''+code+'\','+r.id+',\''+esc(r.title).replace(/'/g,"")+'\')">🖨️ '
    +esc(T('تقرير PDF','PDF report'))+'</button>'
    +(d.can_cancel?'<button class="btn d" style="font-size:11.5px;padding:6px 11px" '
      +'onclick="svcCancel(\''+code+'\',\''+key+'\','+r.id+')">🗑 '+esc(T('إلغاء','Cancel'))+'</button>':'')
    +'</div>'
    +'</div>').join('');
  h+='</div>';
  if((d.pages||1)>1){h+='<div class="toolbar" style="margin-top:14px;justify-content:center">';
    for(let i=1;i<=d.pages;i++)h+='<span class="chip'+(i===d.page?' on':'')+'" onclick="goSvcSec(\''+code+'\',\''+key+'\','+i+')">'+i+'</span>';
    h+='</div>';}
  host.innerHTML=h;
}
const PILLC={ok:'#16a34a',warn:'#f59e0b',danger:'#e11d48',info:'#3b82f6',muted:'#64748b'};
function pillHtml(t,c){const col=PILLC[c]||PILLC.info;
  return '<span class="pill" style="background:'+col+'1f;color:'+col+'">'+esc(t)+'</span>';}
/* Every record can be printed, using the same generic report endpoint the app
   uses — the model code is the Odoo model with dots replaced by underscores. */
function svcReport(code,id,title){
  const key=(String(CUR).split(':')[2]||'');
  const model=(SVC_MODEL[code+':'+key]||'').replace(/\./g,'_');
  if(!model){toast(T('غير متاح','Unavailable'));return;}
  window.open(API+'/report/'+model+'/'+id,'_blank');
}
let SVC_MODEL={};
/* The add form is built from the field list the server sends, so a new field
   on a section appears in the portal without touching this file. */

/* Every record opens. A list you cannot drill into is a report, not a system —
   and the pills alone never carry enough to act on. */
let SVC_ROWS={};
function svcOpenRow(code,key,ix){
  const r=(SVC_ROWS[code+':'+key]||[])[ix]; if(!r)return;
  const model=(SVC_MODEL[code+':'+key]||'').replace(/\./g,'_');
  const pills=(r.pills||[]).map(p=>pillHtml(p.t,p.c)).join(' ');
  const body='<div class="sec">'
    +(r.subtitle?'<div style="color:var(--muted);font-size:12.5px;margin-bottom:9px">'+esc(r.subtitle)+'</div>':'')
    +(pills?'<div style="display:flex;gap:6px;flex-wrap:wrap">'+pills+'</div>':'')
    +'</div>';
  const acts=[{label:T('إغلاق','Close'),cls:'s',onclick:closeDrawer}];
  if(model)acts.push({label:T('تقرير PDF','PDF report'),cls:'b',
    onclick:function(){window.open(API+'/report/'+model+'/'+r.id,'_blank');}});
  if(SVC_CANCEL[code+':'+key])acts.push({label:T('إلغاء','Cancel'),cls:'d',
    onclick:function(){closeDrawer();svcCancel(code,key,r.id);}});
  openDrawer(r.title||'',body,{icon:'📄',subtitle:r.subtitle||'',actions:acts});
}
let SVC_CANCEL={};
async function svcAddForm(code,key){
  let d;try{d=await api('/client/svc/'+code+'/'+key);}catch(e){toast(T('تعذّر التحميل','Could not load'));return;}
  if(!d.can_add){toast(T('لا تملك صلاحية الإضافة','Not permitted'));return;}
  const f=(d.fields||[]).map(x=>{
    const req=x.required?' required':'';
    let inp;
    if(x.kind==='m2o'||x.kind==='select'){
      inp='<select class="inp" id="sf_'+x.name+'" style="width:100%">'
        +(x.required?'':'<option value=""></option>')
        +(x.options||[]).map(o=>'<option value="'+esc(String(o.v))+'"'+(String(o.v)===String(x.default)?' selected':'')+'>'+esc(o.l)+'</option>').join('')
        +'</select>';
    }else if(x.kind==='text'){
      inp='<textarea class="inp" id="sf_'+x.name+'" rows="3" style="width:100%"></textarea>';
    }else if(x.kind==='bool'){
      inp='<input type="checkbox" id="sf_'+x.name+'">';
    }else{
      const t=x.kind==='date'?'date':(x.kind==='datetime'?'datetime-local':(x.kind==='int'||x.kind==='float'?'number':'text'));
      inp='<input type="'+t+'" class="inp" id="sf_'+x.name+'" style="width:100%"'
        +(x.default!==null&&x.default!==undefined?' value="'+esc(String(x.default))+'"':'')+'>';
    }
    return '<div style="margin-bottom:12px"><label style="display:block;font-weight:700;font-size:12.5px;margin-bottom:5px">'
      +esc(x.label)+(x.required?' <span style="color:var(--red)">*</span>':'')+'</label>'+inp
      +(x.help?'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+esc(x.help)+'</div>':'')+'</div>';
  }).join('');
  openDrawer(d.add_label||T('إضافة سجل','Add record'),'<div class="sec">'+f+'</div>',
    {icon:(d.service||{}).icon||'➕',subtitle:(d.section||{}).label,
     actions:[{label:T('إلغاء','Cancel'),cls:'s',onclick:closeDrawer},
              {label:T('حفظ','Save'),cls:'p',onclick:function(){svcAddSave(code,key,d.fields||[]);}}]});
}

/* Cancelling asks first and says what will actually happen — the server picks
   the least destructive path (cancel state, else archive, else delete). */
function svcCancel(code,key,id){
  confirmDialog(T('إلغاء السجل','Cancel record'),
    T('سيُلغى هذا السجل — إن كان له حالة إلغاء تُستخدم، وإلا يُؤرشف.','This record will be cancelled, or archived if it has no cancel state.'),
    async function(){
      try{await api('/client/svc/'+code+'/'+key+'/'+id+'/cancel',{method:'POST',body:{}});}
      catch(e){toast(String(e&&e.message||e).slice(0,120));return;}
      toast(T('تم الإلغاء','Cancelled'));goSvcSec(code,key,1);
    },{danger:true,icon:'🗑'});
}
async function svcAddSave(code,key,fields){
  const body={};
  for(const x of fields){const el=document.getElementById('sf_'+x.name);if(!el)continue;
    body[x.name]=(x.kind==='bool')?(el.checked?'1':''):el.value;
    if(x.required&&!body[x.name]){toast(T('أكمل: ','Required: ')+x.label);return;}}
  try{await api('/client/svc/'+code+'/'+key+'/add',{method:'POST',body:body});}
  catch(e){toast(String(e&&e.message||e).slice(0,120));return;}
  closeDrawer();toast(T('تم الحفظ','Saved'));goSvcSec(code,key,1);
}

async function go(id,activeId){const route=id;

  if(String(id).startsWith('svc:')){const pr=id.split(':');setActive(id);
    document.getElementById('sb').classList.remove('open');closeDrawer();CUR=id;
    await renderSvcSection(pr[1],pr[2]);return;}

  async activity(p){CUR='activity';let filt='all';

      if(fMonth!=='all')r=r.filter(x=>mo(x.date)===fMonth);
      if(fStat==='overdue')r=r.filter(x=>x.overdue);else if(fStat!=='all')r=r.filter(x=>x.payment_state===fStat);
      const sT=r.reduce((a,x)=>a+(x.amount_total||0),0),sP=r.reduce((a,x)=>a+((x.amount_total||0)-(x.amount_residual||0)),0),sR=r.reduce((a,x)=>a+(x.amount_residual||0),0);
      document.getElementById('invKpi').innerHTML='<div class="kpi"><div class="top"><div class="ic" style="background:#334155">💳</div><div><div class="v num">'+sT.toFixed(0)+'</div><div class="l">'+T('إجمالي','Total')+' '+esc(t.currency||'')+'</div></div></div></div>'
        +'<div class="kpi"><div class="top"><div class="ic" style="background:#16a34a">✅</div><div><div class="v num">'+sP.toFixed(0)+'</div><div class="l">'+T('المدفوع','Paid')+'</div></div></div></div>'
        +'<div class="kpi"><div class="top"><div class="ic" style="background:#e11d48">⏳</div><div><div class="v num">'+sR.toFixed(0)+'</div><div class="l">'+T('غير المدفوع','Outstanding')+'</div></div></div></div>'
        +'<div class="kpi"><div class="top"><div class="ic" style="background:#6366f1">🧾</div><div><div class="v num">'+r.length+'</div><div class="l">'+T('عدد الفواتير','Count')+'</div></div></div></div>';
      const AP={pending:['#f59e0b','بانتظار'],accepted:['#16a34a','مقبولة'],rejected:['#e11d48','مرفوضة']};
      const iHead='<thead><tr><th>'+T('الفاتورة','Invoice')+'</th><th>'+T('الفترة','Period')+'</th><th>'+T('التاريخ','Date')+'</th><th>'+T('الاستحقاق','Due')+'</th><th>'+T('الإجمالي','Total')+'</th><th>'+T('المتبقّي','Residual')+'</th><th>'+T('حالة الدفع','Payment')+'</th><th>'+T('موافقتك','Approval')+'</th></tr></thead>';
      const iRow=m=>{const ap=AP[m.client_approval||'pending'];return '<tr class="clk" onclick="openInvoice('+m.id+')"><td><b>'+esc(m.name)+'</b>'+(m.overdue?' <span class="pill" style="background:#fde8ec;color:#e11d48">'+T('متأخرة','overdue')+'</span>':'')+'</td><td><span class="pill" style="background:#eef2ff;color:#4f46e5;font-size:11px">'+esc(m.period||'—')+'</span></td><td class="muted">'+dday(m.date)+'</td><td class="muted">'+dday(m.due)+'</td><td class="num">'+m.amount_total+'</td><td class="num" style="color:'+(m.amount_residual>0?'#e11d48':'#16a34a')+'">'+m.amount_residual+'</td><td><span class="pill" style="background:'+((PS[m.payment_state]||'#64748b')+'1f')+';color:'+(PS[m.payment_state]||'#64748b')+'">'+esc(m.payment_label||m.payment_state)+'</span></td><td><span class="pill" style="background:'+ap[0]+'1f;color:'+ap[0]+'">'+T(ap[1],ap[1])+'</span></td></tr>';};
      pgReset('inv');pagedTable('invList',r,iHead,iRow,'inv',()=>{},20);}
    window.__invYear=v=>{fYear=v;apply();};window.__invMonth=v=>{fMonth=v;apply();};
    window.__invStat=s=>{fStat=s;document.querySelectorAll('#invStat .chip').forEach(c=>c.classList.toggle('on',c.dataset.s===s));apply();};
    const statChips=[['all',T('الكل','All')],['not_paid','🔴 '+T('غير مدفوعة','Unpaid')],['partial','🟠 '+T('جزئية','Partial')],['paid','🟢 '+T('مدفوعة','Paid')],['overdue','⏰ '+T('متأخرة','Overdue')]].map(c=>'<span class="chip'+(c[0]==='all'?' on':'')+'" data-s="'+c[0]+'" onclick="__invStat(\''+c[0]+'\')">'+c[1]+'</span>').join('');
    p.innerHTML='<div class="kpis" id="invKpi"></div>'
      +'<div class="panel" style="margin-top:14px;padding:14px"><div class="toolbar" style="flex-wrap:wrap">'
      +'<select class="inp" onchange="__invYear(this.value)"><option value="all">'+T('كل السنوات','All years')+'</option>'+years.map(y=>'<option value="'+y+'">'+y+'</option>').join('')+'</select>'
      +'<select class="inp" onchange="__invMonth(this.value)"><option value="all">'+T('كل الشهور','All months')+'</option>'+MN.map(mn=>'<option value="'+mn+'">'+T(MLBL[mn],mn)+'</option>').join('')+'</select>'
      +'<div id="invStat" style="display:flex;gap:6px;flex-wrap:wrap">'+statChips+'</div></div></div>'
      +'<div class="panel" style="margin-top:14px"><div id="invList"></div></div>';
    apply();
  },

  // ================= WASTE TRANSFER & TREATMENT =================
  async waste_dash(p){CUR='waste_dash';
    const d=await api('/client/waste/summary').catch(()=>({available:false}));
    if(!d.available){p.innerHTML=emptyState(T('خدمة نقل النفايات غير مفعّلة لموقعك','Waste service not enabled for your site'));return;}
    const F=window.__wF||(window.__wF={from:'',to:'',state:'',q:''});
    const qs=Object.entries({date_from:F.from,date_to:F.to,state:F.state,q:F.q}).filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const rs=await api('/client/waste/orders'+(qs?'?'+qs:'')).catch(()=>[]);
    const STL={draft:'مسودة',scheduled:'مجدول',pickuped:'تم الالتقاط',arrived:'وصل',processing:'قيد المعالجة',delivered:'تم التسليم',completed:'مكتمل',cancelled:'ملغى'};
    const ST={draft:'#94a3b8',scheduled:'#3b82f6',pickuped:'#0891b2',arrived:'#6366f1',processing:'#f59e0b',delivered:'#16a34a',completed:'#16a34a',cancelled:'#e11d48'};
    // aggregate the filtered set
    let qty=0,wt=0;const byState={},byItem={};
    rs.forEach(o=>{qty+=(+o.qty_total||0);wt+=(+o.weight_total||0);
      byState[o.state]=(byState[o.state]||0)+1;
      (o.items||[]).forEach(i=>{const k=i.item||'—';byItem[k]=(byItem[k]||0)+(+i.qty||0);});});
    const n=v=>{const x=+v||0;return x===Math.round(x)?x:(+x.toFixed(1));};
    const card=(ic,v,l,c)=>'<div class="kpi"><div class="top"><div class="ic" style="background:'+c+'">'+ic+'</div><div><div class="v num">'+v+'</div><div class="l">'+l+'</div></div></div></div>';
    // state distribution bar
    const total=rs.length||1;
    const bar=Object.entries(byState).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      '<div style="flex:'+v+';background:'+(ST[k]||'#cbd5e1')+';height:10px" title="'+esc(STL[k]||k)+': '+v+'"></div>').join('');
    const legend=Object.entries(byState).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-left:12px">'
      +'<span style="width:9px;height:9px;border-radius:50%;background:'+(ST[k]||'#cbd5e1')+'"></span>'
      +esc(STL[k]||k)+' <b>'+v+'</b> <span class="muted">('+Math.round(v*100/total)+'%)</span></span>').join('');
    // top items
    const top=Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const mx=top.length?top[0][1]:1;
    const bars=top.map(([k,v])=>'<div style="margin-bottom:7px">'
      +'<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span>'+esc(k)+'</span><b class="num">'+n(v)+'</b></div>'
      +'<div style="background:#f1f5f9;border-radius:6px;height:7px"><div style="width:'+Math.max(4,Math.round(v*100/mx))+'%;height:7px;border-radius:6px;background:linear-gradient(90deg,#16a34a,#0891b2)"></div></div></div>').join('')
      ||'<div class="muted">—</div>';

    p.innerHTML='<div class="kpis">'
        +card('♻️',rs.length,T('أوامر (بعد الفلترة)','Orders (filtered)'),'#16a34a')
        +card('📦',n(qty),T('إجمالي الكمية','Total quantity'),'#6366f1')
        +card('⚖️',n(wt),T('إجمالي الوزن (كجم)','Total weight (kg)'),'#0891b2')
        +card('🚛',d.trips,T('الرحلات','Trips'),'#f59e0b')
        +card('🏭',d.centers,T('مراكز المعالجة','Centers'),'#334155')
      +'</div>'
      // filters
      +'<div class="panel" style="margin-top:14px;padding:12px">'
        +'<div class="sec-t" style="margin-top:0">'+T('الفلاتر','Filters')+'</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
          +'<div style="flex:1;min-width:130px"><label class="lbl">'+T('من تاريخ','From')+'</label><input class="inp" type="date" id="wfFrom" value="'+esc(F.from)+'"></div>'
          +'<div style="flex:1;min-width:130px"><label class="lbl">'+T('إلى تاريخ','To')+'</label><input class="inp" type="date" id="wfTo" value="'+esc(F.to)+'"></div>'
          +'<div style="flex:1;min-width:130px"><label class="lbl">'+T('الحالة','Status')+'</label><select class="inp" id="wfState">'
            +'<option value="">'+T('الكل','All')+'</option>'
            +Object.keys(STL).map(k=>'<option value="'+k+'"'+(F.state===k?' selected':'')+'>'+esc(STL[k])+'</option>').join('')
          +'</select></div>'
          +'<div style="flex:1.4;min-width:150px"><label class="lbl">'+T('بحث','Search')+'</label><input class="inp" id="wfQ" value="'+esc(F.q)+'" placeholder="'+T('رقم الأمر أو الموقع','Order no. or location')+'"></div>'
          +'<button class="btn p" style="height:38px" onclick="wfApply()">🔎 '+T('تطبيق','Apply')+'</button>'
          +'<button class="btn" style="height:38px" onclick="wfClear()">✕ '+T('مسح','Clear')+'</button>'
        +'</div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'
          +[['7',T('آخر 7 أيام','Last 7d')],['30',T('آخر 30 يومًا','Last 30d')],['90',T('آخر 90 يومًا','Last 90d')],['365',T('هذه السنة','This year')]]
            .map(([k,l])=>'<button class="btn" style="font-size:11.5px;padding:5px 10px" onclick="wfQuick('+k+')">'+l+'</button>').join('')
        +'</div>'
        +'<div style="display:flex;gap:8px;margin-top:12px">'
          +'<button class="btn p" style="flex:1" onclick="wfPrint()">🖨️ '+T('طباعة تقرير الفترة','Print period report')+'</button>'
          +'<button class="btn" style="flex:1" onclick="wfCsv()">⬇️ '+T('تصدير CSV','Export CSV')+'</button>'
        +'</div>'
      +'</div>'
      // distribution
      +'<div class="panel" style="margin-top:14px;padding:12px">'
        +'<div class="sec-t" style="margin-top:0">'+T('توزيع الحالات','Status distribution')+'</div>'
        +(rs.length?'<div style="display:flex;border-radius:6px;overflow:hidden;margin:8px 0">'+bar+'</div><div>'+legend+'</div>':'<div class="muted">—</div>')
      +'</div>'
      +'<div class="panel" style="margin-top:14px;padding:12px">'
        +'<div class="sec-t" style="margin-top:0">'+T('أكثر الأصناف نقلًا','Top transported items')+'</div>'+bars

};

async function refreshCounts(){try{const [wos,rq,inv]=await Promise.all([api('/client/workorders?state=open').then(asArr).catch(()=>[]),api('/client/requests').catch(()=>[]),api('/client/invoices').catch(()=>({invoices:[]}))]);COUNTS.open=wos.length;COUNTS.requests=rq.filter(r=>r.state_raw==='new').length;COUNTS.unpaid=(inv.invoices||[]).filter(x=>x.amount_residual>0).length;updateCounts();}catch(e){}}
async function boot(){try{ME=await api('/me');}catch(e){showLogin();return;}
  document.getElementById('splash').style.display='none';document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
  const u=ME.user||{};document.getElementById('uname').textContent=u.name||'';document.getElementById('urole').textContent=(ME.is_admin?'أدمن':ME.is_supervisor?'مشرف':ME.role||'مستخدم');document.getElementById('uav').textContent=(u.name||'?').trim().charAt(0);
  document.getElementById('sbFoot').textContent=(u.name||'')+' · '+(ME.role||'');
  if(ME.unread_notifications){const b=document.getElementById('nbadge');b.style.display='inline-block';b.textContent=ME.unread_notifications;}
  await loadPalette();
  try{const sd=await api('/client/services');SERVICES=(sd&&sd.services)||[];}catch(e){SERVICES=[];}
  await loadSvcReg();   // what each service is made of, straight from the backend
  try{const pr=await api('/client/projects');window.__PROJECTS=pr||[];if((pr||[]).length>1){const sel=document.getElementById('projSel');sel.style.display='inline-block';sel.innerHTML='<option value="all">🗂️ '+T('كل المشاريع','All projects')+'</option>'+pr.map(x=>'<option value="'+x.id+'"'+(String(PROJECT)===String(x.id)?' selected':'')+'>'+esc(x.name)+'</option>').join('');}}catch(e){}
  renderNav();go('dashboard');refreshCounts();setInterval(refreshCounts,60000);
}
function showLogin(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
(async function(){applyDir();await loadBrand();
  if(TOKEN){boot();}      // splash stays visible until boot() reveals the app
  else{showLogin();}
})();
</script>
