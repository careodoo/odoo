<title>بوابة إدارة المشاريع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
/* ===== Layout: fixed RTL sidebar (inline-end) + sticky topbar + data-driven screen body =====
   Palette: premium CARE navy + gold on cool light; full dark mirror. Type: Tajawal. */
:root{
  --navy:#0e2a47; --navy-800:#12304f; --navy-700:#1b4674; --navy-600:#245a92;
  --gold:#c9a14a; --gold-soft:#f2e6c9;
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eff3f9;
  --ink:#0f1b2d; --ink-2:#38475c; --muted:#6b7a90; --line:#e4e9f1; --line-2:#eef2f8;
  --ok:#15934f; --ok-bg:#e4f5ec; --warn:#c07c16; --warn-bg:#fbf0da; --crit:#d23b3b; --crit-bg:#fbe7e7;
  --info:#2763c9; --info-bg:#e7eefb;
  --shadow:0 1px 2px rgba(16,27,45,.04),0 8px 24px rgba(16,27,45,.06);
  --shadow-lg:0 12px 40px rgba(16,27,45,.14);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --font:"Tajawal",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0b1626; --navy-800:#0e1f36; --navy-700:#1b4674; --navy-600:#2b6aa8;
  --gold:#d8b25a; --gold-soft:#3a331f;
  --bg:#070d17; --surface:#0f1b2d; --surface-2:#132033; --surface-3:#17263c;
  --ink:#e9eef6; --ink-2:#aeb9c9; --muted:#8696ab; --line:#1e2d44; --line-2:#1a2639;
  --ok:#38c17e; --ok-bg:#10301f; --warn:#e0a13a; --warn-bg:#352709; --crit:#ef6b6b; --crit-bg:#3a1414;
  --info:#5a92e8; --info-bg:#132542;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#0b1626; --navy-800:#0e1f36; --navy-700:#1b4674; --navy-600:#2b6aa8;
  --gold:#d8b25a; --gold-soft:#3a331f;
  --bg:#070d17; --surface:#0f1b2d; --surface-2:#132033; --surface-3:#17263c;
  --ink:#e9eef6; --ink-2:#aeb9c9; --muted:#8696ab; --line:#1e2d44; --line-2:#1a2639;
  --ok:#38c17e; --ok-bg:#10301f; --warn:#e0a13a; --warn-bg:#352709; --crit:#ef6b6b; --crit-bg:#3a1414;
  --info:#5a92e8; --info-bg:#132542;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:800;text-wrap:balance;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:#1a1405}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100%}
@media(max-width:960px){.app{grid-template-columns:1fr}}

/* Sidebar — light & colorful (right side in RTL) */
.side{grid-column:1;grid-row:1;background:linear-gradient(190deg,var(--surface-2),var(--surface));
  color:var(--ink-2);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  border-inline-start:1px solid var(--line);z-index:40}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px;border-bottom:1px solid var(--line-2)}
.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#a9842f);
  display:grid;place-items:center;color:#1a1405;font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(201,161,74,.4)}
.brand-name{font-weight:800;font-size:16px;color:var(--ink);line-height:1.15}
.brand-sub{font-size:11px;color:var(--muted);font-weight:500}
.side-scroll{flex:1;overflow-y:auto;padding:4px 10px 20px}
.side-scroll::-webkit-scrollbar{width:7px}.side-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.nav-group{margin-top:11px}
.nav-group-t{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;color:var(--ink-2);
  font-size:13.5px;font-weight:600;position:relative;transition:background .14s,color .14s;margin-bottom:2px}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.active{background:var(--gcs,var(--surface-3));color:var(--gc,var(--ink));font-weight:800}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:-10px;top:50%;transform:translateY(-50%);
  width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--gc,var(--gold))}
.nav-item .ic{width:19px;height:19px;flex:none}
.nav-item .badge{margin-inline-start:auto;background:var(--gc,var(--gold));color:#fff;font-size:10.5px;font-weight:800;
  min-width:19px;height:19px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* Main */
.main{grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  padding-block:11px;padding-inline:max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-left,0px))}
.menu-btn{display:none;width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;color:var(--ink);place-items:center}
@media(max-width:960px){.menu-btn{display:grid}}
.proj-switch{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:7px 12px;min-width:0}
.proj-switch .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-bg)}
.proj-switch b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-switch .chev{color:var(--muted)}
.search{flex:0 1 380px;min-width:0;display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:8px 13px;max-width:380px}
.search input{border:0;background:transparent;outline:none;color:var(--ink);font-family:inherit;font-size:13.5px;width:100%}
.search input::placeholder{color:var(--muted)}
.gsres{position:absolute;top:calc(100% + 8px);inset-inline-start:0;inset-inline-end:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);max-height:min(70vh,520px);overflow:auto;z-index:60;padding:6px}
.gsres .gsg{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px 4px}
.gsres .gsi{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;cursor:pointer}
.gsres .gsi:hover,.gsres .gsi.on{background:var(--surface-2)}
.gsres .gsi .gsic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--navy-600)}
.gsres .gsi .gst{font-weight:700;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsres .gsi .gss{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsres .gsmore{font-size:11px;color:var(--muted);padding:6px 12px 9px;text-align:center}
.gsres .gsempty{padding:20px 12px;text-align:center;color:var(--muted);font-size:12.5px}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;
  color:var(--ink-2);display:grid;place-items:center;position:relative;transition:.13s}
.icon-btn:hover{border-color:var(--gold);color:var(--ink)}
.icon-btn .dot{position:absolute;top:8px;inset-inline-end:9px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:1.5px solid var(--surface)}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--navy-600),var(--navy-700));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}

.content{flex:1;padding-block:18px 36px;
  padding-inline:max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-left,0px))}
.wrap{max-width:none;margin:0}

/* Page head */
.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:9px}
.crumb .sep{opacity:.5}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.phead .pic{width:46px;height:46px;border-radius:13px;background:var(--gold-soft);color:var(--navy);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .phead .pic,.dk .phead .pic{color:var(--gold)}
.phead h1{font-size:22px;letter-spacing:-.02em}
.phead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.phead .pbtn{margin-inline-start:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:10px 15px;font-weight:700;font-size:13px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--navy-700),var(--navy));color:#fff;box-shadow:0 6px 18px rgba(27,70,116,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ab8630);color:#1a1405;box-shadow:0 6px 18px rgba(201,161,74,.32)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--ink)}
.btn .ic{width:17px;height:17px}

/* Stat row (the premium top stats on every screen) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--accent,var(--navy-600))}
.stat .sl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:9px}
.stat .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-bg,var(--surface-3));color:var(--accent,var(--navy-600));flex:none}
.stat .sv{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .sf{display:flex;align-items:center;gap:7px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.chip.up{background:var(--ok-bg);color:var(--ok)}.chip.down{background:var(--crit-bg);color:var(--crit)}
.chip.flat{background:var(--surface-3);color:var(--muted)}
.stat .ssub{color:var(--muted);font-size:11.5px}
.spark{height:26px;width:72px;margin-inline-start:auto}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 12px;flex:1;min-width:180px;max-width:320px}
.tsearch input{border:0;background:transparent;outline:none;color:var(--ink);font-family:inherit;width:100%;font-size:13px}
.fchips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tspace{margin-inline-start:auto}

/* Card / panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h3{font-size:14.5px}
.panel-h .cnt{color:var(--muted);font-size:12px;font-weight:600}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em;
  padding:11px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .main{color:var(--ink);font-weight:700}
.tbl .sub{color:var(--muted);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mut{background:var(--surface-3);color:var(--muted)}
.wchip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:1px 8px;border-radius:999px;vertical-align:middle;margin-inline-start:7px;line-height:1.7;white-space:nowrap}
.wchip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.wchip.ok{background:var(--ok-bg);color:var(--ok)}.wchip.warn{background:var(--warn-bg);color:var(--warn)}
.wchip.crit{background:var(--crit-bg);color:var(--crit)}.wchip.info{background:var(--info-bg);color:var(--info)}
.wchip.mut{background:var(--surface-3);color:var(--muted)}
.wstat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.rowact button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.rowact button:hover{border-color:var(--gold);color:var(--ink)}
.avatarmini{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--navy-600),var(--navy-700));color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.wphoto{position:relative;width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;cursor:pointer;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.wphoto:hover{transform:scale(1.07);box-shadow:0 4px 12px rgba(0,0,0,.28)}
.wphoto .wini{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy-600),var(--navy-700));color:#fff;font-weight:800;font-size:12px}
.wphoto img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;background:var(--surface-3)}
@media(max-width:760px){.storecols{grid-template-columns:1fr!important}}
.tbl .bchk{width:38px;text-align:center;padding-inline:6px}
.tbl .bchk input{width:16px;height:16px;cursor:pointer;accent-color:var(--navy-600)}
.bulkbar{display:flex;align-items:center;gap:8px;padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.bulkbar .bcount{font-size:13px;font-weight:700;color:var(--ink)} .bulkbar .bcount b{color:var(--navy-600)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:skel 1.3s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skelrow{display:flex;gap:12px;align-items:center;padding:12px 4px}
.attn-panel{border-inline-start:3px solid var(--c-amber)}
.attn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
.attn-chip{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:var(--surface-2);border:1px solid var(--line-2);border-inline-start:3px solid var(--ac);border-radius:11px;padding:10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;font-family:inherit}
.attn-chip:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.attn-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.attn-n{font-size:18px;font-weight:800;min-width:26px;text-align:center}
.attn-t{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.attn-go{color:var(--muted);flex:none;display:flex}
.tsgrid{border-collapse:collapse;font-size:11px}
.tsgrid th,.tsgrid td{border:1px solid var(--line-2);text-align:center;padding:4px 2px}
.tsgrid .tsh{background:var(--surface-2);font-weight:700;position:sticky;top:0;z-index:2}
.tsgrid .tsname{position:sticky;inset-inline-start:0;background:var(--surface);min-width:138px;max-width:138px;text-align:right;padding:5px 9px;z-index:1}
.tsgrid thead .tsname{z-index:3}
.tsgrid .tsh.wk{background:var(--surface-3)}
.tsgrid .tsapp{font-weight:800;color:var(--c-teal);min-width:44px;background:var(--surface)}
.tsgrid .tsxrow td{background:color-mix(in srgb,var(--c-amber) 9%,var(--surface));border-top:0}
.tsgrid .tsxrow .tsxn{font-weight:800;color:var(--c-amber);font-size:10.5px}
.tschip{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.tschip b{font-weight:900} .tschip.on{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.tscell{min-width:40px;height:auto;font-weight:800;color:var(--ink);position:relative;user-select:none;padding:3px 2px}
.tscell .tsc{display:block;font-size:11px;font-weight:800;line-height:1.05}
.tscell .tsn{display:block;font-size:7.5px;font-weight:600;opacity:.95;line-height:1;margin-top:1px;white-space:nowrap}
.tscell .tshrs{display:block;font-size:7.5px;font-weight:900;line-height:1;margin-top:1px;background:color-mix(in srgb,var(--ink) 7%,var(--surface));border-radius:3px;padding:0 2px}
.tscell .tshrs.up{color:#065f46} .tscell .tshrs.dn{color:#991b1b} .tscell .tshrs.eq{color:#334155}
.tscell.tsxfercell{position:relative;overflow:visible}
.tscell .tsxferlbl{position:absolute;top:50%;inset-inline-start:3px;transform:translateY(-50%);white-space:nowrap;font-size:9.5px;font-weight:900;color:#fff;background:rgba(15,23,42,.78);padding:2px 8px;border-radius:5px;z-index:6;pointer-events:none;box-shadow:0 2px 7px rgba(0,0,0,.35)}
.tscell.tssel{outline:3px solid var(--navy-600);outline-offset:-3px}
.tsdot{position:absolute;top:2px;inset-inline-end:2px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
/* ألوان أهدأ ومريحة للعين: خلفية ناعمة + نص ملوّن بنفس المنظومة (متوافق فاتح/داكن) */
.ts-P{background:color-mix(in srgb,#15934f 15%,var(--surface));color:#148a4a}
.ts-A{background:color-mix(in srgb,#d23b3b 15%,var(--surface));color:#cb4040}
.ts-O{background:color-mix(in srgb,#8696ab 17%,var(--surface));color:#6b7a8e}
.ts-L{background:color-mix(in srgb,#2f6fe0 14%,var(--surface));color:#3570dd}
.ts-H{background:color-mix(in srgb,#8a63d2 16%,var(--surface));color:#7d57c6}
.ts-S{background:color-mix(in srgb,#c07c16 17%,var(--surface));color:#b0760f}
.ts-X{background:color-mix(in srgb,#5a6577 13%,var(--surface));color:#717d90}
.ts-T{background:color-mix(in srgb,#e0922f 17%,var(--surface));color:#c97c1e}
.ts-E{background:color-mix(in srgb,#13a0a0 15%,var(--surface));color:#0e8f8f}
.ts-empty{background:var(--surface-2);color:var(--muted)}
/* خلية الإضافي داخل الشبكة */
.tscell .tsxb{display:block;font-size:7.5px;font-weight:900;line-height:1;margin-top:1px;color:#b0760f;background:color-mix(in srgb,#e0922f 22%,var(--surface));border-radius:3px;padding:0 2px}
.tscell.tsxday{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#e0922f 55%,transparent)}
.tscell .tsxcorner{position:absolute;top:1px;inset-inline-start:2px;font-size:8px;line-height:1;color:#c97c1e;pointer-events:none}
.tscell .tsxb{cursor:pointer}
.tscell .tsplane{position:absolute;bottom:1px;inset-inline-start:2px;font-size:8.5px;line-height:1;pointer-events:none;opacity:.9}
/* أيقونات مصدر الخانة (بصمة/يدوي) في زاويتي الأسفل */
.tscell .tssrc{position:absolute;bottom:1px;width:9px;height:9px;line-height:0;pointer-events:none;opacity:.9}
.tscell .tssrc-bio{inset-inline-end:2px}
.tscell .tssrc-man{inset-inline-end:12px}
/* تعليم «بديل» تلقائيًّا على خانة العامل الغائب المُغطّاة ببديل */
.tscell.tscovsub{box-shadow:inset 0 0 0 1.6px color-mix(in srgb,#6d33d6 60%,transparent)}
.tscell .tscovlbl{position:absolute;top:1px;inset-inline-start:2px;font-size:7px;font-weight:900;color:#fff;background:#6d33d6;border-radius:4px;padding:0 3px;line-height:1.5;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* القائمة المنسدلة لاختيار الحالة: نص داكن واضح على الخلفية الناعمة */
#_tspop .tsopt{color:var(--ink);font-weight:800;padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
#_tspop .tsopt b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;font-weight:900;background:color-mix(in srgb,var(--ink) 10%,var(--surface))}
#_tspop .tsopt:hover{filter:brightness(.97)}
.tsnewbadge{display:inline-block;font-size:8.5px;font-weight:900;color:#fff;background:var(--c-emerald);border-radius:20px;padding:1px 7px;vertical-align:middle;margin-inline-start:4px;box-shadow:0 1px 4px color-mix(in srgb,var(--c-emerald) 45%,transparent)}
/* صفوف العمّال الواردين: تمييز أزرق فاتح (sky) مع إبقاء ألوان حالات الأيام ظاهرة */
.tsgrid .tsincrow .tsname{background:color-mix(in srgb,var(--c-sky) 11%,var(--surface))}
.tsgrid .tsincrow .tsapp,.tsgrid .tsincrow .tsstat{background:color-mix(in srgb,var(--c-sky) 9%,var(--surface))}
.tscell.tsxincoff{background:color-mix(in srgb,var(--c-sky) 6%,var(--surface))}
.tscell.tsxincday{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c-sky) 55%,transparent)}
/* صفّ الإضافي الأزرق */
.tsgrid .tsxwrow td{background:color-mix(in srgb,var(--c-sky) 7%,var(--surface))}
.tsgrid .tsxwrow .tsname.tsxwname{background:color-mix(in srgb,var(--c-sky) 14%,var(--surface));box-shadow:inset 3px 0 0 var(--c-sky)}
.tsgrid .tsxwrow .tscell{height:34px}
.tscell.tsxwcell{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c-sky) 50%,transparent)}
.tscell.tsxwoff{background:color-mix(in srgb,var(--c-sky) 4%,var(--surface));opacity:.55}
body.pmx-standalone .topbar,body.pmx-standalone .side{display:none!important}
body.pmx-standalone .content{margin:0!important;padding:0!important}
body.pmx-standalone .content .wrap{max-width:none!important;padding:8px 10px!important}
body.pmx-standalone .back{display:none!important}
.pmx-ro-badge{position:fixed;top:8px;inset-inline-end:10px;z-index:9999;background:linear-gradient(135deg,#475569,#1e293b);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(15,23,42,.3);pointer-events:none}
#tsFsOverlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:var(--bg,#f4f6fb);display:flex;flex-direction:column}

.tsfs-stats{display:flex;gap:7px;flex-wrap:wrap;flex:1}

.tsfs-stat .v{font-weight:900;font-size:16px;line-height:1.1}
.tsfs-stat .l{font-size:9.5px;color:var(--muted);font-weight:700}
.tsfs-x{background:var(--c-rose,#e11d48);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:13px}
.tsfs-body{flex:1;overflow:auto;padding:8px}
#tsFsBody #tsGridPanel{max-height:none!important;height:100%;border:0;border-radius:0}

#tsFsBody .tsgrid td.tscell{height:38px}

/* تقاطع خفيف احترافي عند المرور (صف + عمود) */
.tsgrid th.tshl-col{background:color-mix(in srgb,var(--navy-600) 15%,var(--surface))!important;color:var(--navy)}
.tsgrid td.tshl-col{outline:1px solid color-mix(in srgb,var(--navy-600) 16%,transparent);outline-offset:-1px}
.tsgrid tr.tshl-row>td{outline:1px solid color-mix(in srgb,var(--navy-600) 13%,transparent);outline-offset:-1px}
.tsgrid tr.tshl-row>td.tsname{background:color-mix(in srgb,var(--navy-600) 11%,var(--surface))!important;box-shadow:inset 3px 0 0 var(--navy-600)}
.tscell .tsxb.tsxbsky{color:var(--c-sky);background:color-mix(in srgb,var(--c-sky) 20%,var(--surface))}
.tsopt{padding:7px 10px;border-radius:8px;cursor:pointer;color:#fff;font-size:12px;margin:2px 0;display:flex;gap:7px;align-items:center}
.tsopt:hover{filter:brightness(1.12)}
.cellflex{display:flex;align-items:center;gap:10px}

/* Card grid (store / materials) */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gcard .thumb{height:92px;background:linear-gradient(135deg,var(--surface-3),var(--surface-2));display:grid;place-items:center;color:var(--navy-600)}
.gcard .gb{padding:12px 13px}
.gcard h4{font-size:13.5px}
.gcard .gm{color:var(--muted);font-size:11.5px;margin-top:3px}
.gcard .gf{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.gcard .price{font-weight:800;color:var(--ink);font-size:14px}

/* Dashboard specifics */
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-700) 100%);border-radius:var(--r-lg);color:#fff;
  padding:22px 24px;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;inset-block:-40%;inset-inline-end:-6%;width:300px;
  background:radial-gradient(circle,rgba(201,161,74,.28),transparent 68%)}
.hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative}
.hero h1{color:#fff;font-size:23px;letter-spacing:-.02em}
.hero .loc{color:#aec3dd;font-size:13px;margin-top:3px}
.hero .hstat{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;position:relative}
.hero .hstat .v{font-size:22px;font-weight:800;color:#fff}
.hero .hstat .l{font-size:12px;color:#aec3dd}
.hero .prog{margin-top:18px;position:relative}
.hero .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.16);overflow:hidden}
.hero .bar > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),#e6c877)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.qab{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-weight:700;font-size:13px}
.qab:hover{border-color:var(--gold)}
.qab .qi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--navy-600);flex:none}
.feed{display:flex;flex-direction:column}
.fitem{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.fitem:last-child{border:0}
.fitem .fi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.fitem .ft{font-weight:600;color:var(--ink);font-size:13px}
.fitem .fm{color:var(--muted);font-size:11.5px;margin-top:2px}
.barrow{display:flex;align-items:center;gap:11px;padding:9px 16px}
.barrow .bl{width:92px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.barrow .bt{flex:1;height:9px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.barrow .bt > i{display:block;height:100%;border-radius:7px}
.barrow .bn{width:30px;text-align:end;font-weight:800;font-size:12.5px}

.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 24%,transparent);
  border-radius:var(--r);padding:12px 14px;color:var(--ink);font-size:13px;margin-bottom:16px}
.note .ic{color:var(--info);flex:none}

/* Drawer backdrop (mobile) */
.backdrop{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(6,12,22,.5);z-index:39}
body.navopen .backdrop{display:block}
@media(max-width:960px){
  .side{position:fixed;top:0;bottom:0;right:0;left:auto;inset-block:0;inset-inline-start:0;width:272px;transform:translateX(100%);transition:transform .22s}
  body.navopen .side{transform:translateX(0)}
}
/* ---- Accent palette (multi-hue, professional variety) ---- */
:root{
  --c-blue:#2563a8;--c-indigo:#4a5bd0;--c-violet:#7a54c9;--c-teal:#0e9488;--c-emerald:#1f9a55;--c-sky:#1f86c7;--c-rose:#cc4668;--c-plum:#974d87;--c-amber:#c58a22;
  --sb-blue:#e8f0fa;--sb-indigo:#ecedfb;--sb-violet:#f1ebfb;--sb-teal:#e2f4f1;--sb-emerald:#e5f5eb;--sb-sky:#e6f2fb;--sb-rose:#fbe9ee;--sb-plum:#f6eaf3;--sb-amber:#f9efd9;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-blue:#5a92e8;--c-indigo:#8491ee;--c-violet:#a88ae6;--c-teal:#3dc3b4;--c-emerald:#45c57e;--c-sky:#53aeea;--c-rose:#ec7a95;--c-plum:#c382b2;--c-amber:#e0b24f;
  --sb-blue:#13243f;--sb-indigo:#1b1f3e;--sb-violet:#241b3c;--sb-teal:#0c2b29;--sb-emerald:#0f2b1c;--sb-sky:#102636;--sb-rose:#331520;--sb-plum:#2b1726;--sb-amber:#2f2510;
}}
:root[data-theme="dark"]{
  --c-blue:#5a92e8;--c-indigo:#8491ee;--c-violet:#a88ae6;--c-teal:#3dc3b4;--c-emerald:#45c57e;--c-sky:#53aeea;--c-rose:#ec7a95;--c-plum:#c382b2;--c-amber:#e0b24f;
  --sb-blue:#13243f;--sb-indigo:#1b1f3e;--sb-violet:#241b3c;--sb-teal:#0c2b29;--sb-emerald:#0f2b1c;--sb-sky:#102636;--sb-rose:#331520;--sb-plum:#2b1726;--sb-amber:#2f2510;
}
/* ---- Sidebar colored icon chips ---- */
.nav-item .nic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;transition:transform .15s}
.nav-item:hover .nic{transform:scale(1.09)}
.nav-item .nic .ic{width:16px;height:16px;opacity:1}
.nav-item.active .nic{box-shadow:0 0 0 1.5px color-mix(in srgb,currentColor 50%,transparent)}
/* ---- Premium motion ---- */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes sheen{0%{transform:translateX(120%)}55%,100%{transform:translateX(-260%)}}
@keyframes glow{0%,100%{box-shadow:0 4px 14px rgba(201,161,74,.35)}50%{box-shadow:0 6px 24px rgba(201,161,74,.62)}}
.brand-logo{animation:glow 3.6s ease-in-out infinite}
#screen.enter>*:not(.stats){animation:riseIn .5s cubic-bezier(.22,.7,.3,1) both}
#screen.enter>*:nth-child(2){animation-delay:.04s}
#screen.enter>*:nth-child(4){animation-delay:.1s}
#screen.enter>*:nth-child(5){animation-delay:.15s}
#screen.enter .stat{animation:riseIn .52s cubic-bezier(.22,.7,.3,1) both}
#screen.enter .stat:nth-child(1){animation-delay:.05s}
#screen.enter .stat:nth-child(2){animation-delay:.12s}
#screen.enter .stat:nth-child(3){animation-delay:.19s}
#screen.enter .stat:nth-child(4){animation-delay:.26s}
#screen.enter .gcard{animation:riseIn .5s both}
.spk-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .2s ease forwards}
.bt>i,.hero .bar>i{transform-origin:right;animation:growx .95s cubic-bezier(.3,.85,.3,1) both}
.stat,.gcard,.panel{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.stat:hover,.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent,var(--navy-600)) 42%,var(--line))}
.btn{transition:transform .12s ease,filter .15s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.qab,.fchip,.icon-btn,.proj-switch,.rowact button{transition:all .15s ease}
.hero .sheen{position:absolute;inset-block:0;inset-inline-start:0;width:45%;pointer-events:none;z-index:0;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- Record detail (شاشة تفاصيل السجل) ---- */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:12px;cursor:pointer}
.back:hover{color:var(--ink)}
.dhead{background:linear-gradient(120deg,var(--dc,var(--navy-600)),color-mix(in srgb,var(--dc,var(--navy-600)) 58%,#0a1322));border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden;color:#fff}
.dhead::after{content:"";position:absolute;inset-block:-45%;inset-inline-end:-4%;width:300px;background:radial-gradient(circle,rgba(255,255,255,.17),transparent 66%);pointer-events:none}
.dhead-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative}
.dhead .dpic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.2);color:#fff}
.dhead h1{font-size:21px;letter-spacing:-.02em;color:#fff}
.dhead .dref{color:rgba(255,255,255,.82);font-size:12.5px;margin-top:3px;font-weight:600}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative}
.dchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:6px 11px;font-size:12px;color:#fff;font-weight:600}
.dchip .ic{width:14px;height:14px;color:rgba(255,255,255,.82)}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.dstats{grid-template-columns:repeat(2,1fr)}}
.dstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.dstat .dl{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:5px}
.dstat .dv{font-size:19px;font-weight:800;letter-spacing:-.01em}
.dact{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.dgrid{grid-template-columns:1fr}}
.scwrap{position:relative}.scinp{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface-2);color:var(--ink);box-sizing:border-box;outline:none}.scinp:focus{border-color:var(--navy)}.sclist{position:absolute;z-index:60;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:244px;overflow:auto;box-shadow:0 14px 36px rgba(0,0,0,.24)}.scitem{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-2)}.scitem:hover{background:var(--surface-2)}.scitem.muted{color:var(--muted);cursor:default}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;position:sticky;top:0;z-index:6;background:var(--bg);scroll-margin-top:0;padding-top:6px}
.dtab{padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:0;border-inline:0}
.dtab.on{color:var(--ink);border-bottom-color:var(--dc,var(--navy-600))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
.field{background:var(--surface);padding:12px 14px}
.field .fl{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:3px}
.field .fv{color:var(--ink);font-size:13.5px;font-weight:700}
.tl{position:relative;padding-inline-start:26px;padding-block:4px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;inset-inline-start:-26px;top:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.tl-dot.ok{border-color:var(--ok);color:var(--ok)}.tl-dot.on{border-color:var(--gold);color:var(--gold)}
.tl-t{font-weight:700;font-size:13px;color:var(--ink)}
.tl-m{color:var(--muted);font-size:11.5px;margin-top:2px}
.filegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.filegrid{grid-template-columns:1fr}}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;background:var(--surface)}
.file .fic{width:34px;height:34px;border-radius:8px;background:var(--crit-bg);color:var(--crit);display:grid;place-items:center;flex:none}
.sidecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.sidecard .sh{padding:12px 15px;border-bottom:1px solid var(--line-2);font-weight:800;font-size:13.5px}

.relitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.relitem:last-child{border:0}
.wf{display:flex;flex-direction:column;gap:8px;padding:12px 15px}
.msg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.msg:last-child{border:0}
.msg .mn{font-weight:700;font-size:12.5px;color:var(--ink)}.msg .mt{color:var(--ink-2);font-size:12.5px;margin-top:2px}.msg .md{color:var(--muted);font-size:11px;margin-top:3px}
/* ---- Colorful dashboard KPIs + shortcuts ---- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}

const spark=(arr,c)=>{const w=72,h=26;
  arr=(arr||[]).map(Number).filter(v=>isFinite(v));

  const area=`0,${h} ${pts} ${w},${h}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="${area}" fill="${c}" opacity=".12"/><polyline class="spk-line" pathLength="1" points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${w}" cy="${yOf(arr[n-1])}" r="2.4" fill="${c}"/></svg>`;};

function detailAction(code,idx,label){
  label=(label||'').trim();
  var sc=S[code]||{}; var rid=(sc.ids||[])[idx];
  if(label.indexOf('طباعة')>=0){ printRec(code,idx); return; }
  if(code==='allowances'){
    if(label.indexOf('إيقاف')>=0){ allowanceStop(rid); return; }
    if(label.indexOf('استئناف')>=0||label.indexOf('مباشر')>=0){ allowancePrint(rid); return; }
  }
  if(code==='extrawork'&&(label.indexOf('طلب إيقاف')>=0||label.indexOf('طلب إنهاء')>=0)){
    if(!rid){ toast('لا يوجد سجل مرتبط'); return; }
    var _kind=(label.indexOf('إنهاء')>=0)?'end':'pause';
    var _rsn=prompt((_kind==='end'?'سبب طلب الإنهاء':'سبب طلب الإيقاف')+' (اختياري):')||'';
    if(!confirm('إرسال '+(_kind==='end'?'طلب إنهاء':'طلب إيقاف')+' التكليف لاعتماد الموارد البشرية؟')) return;
    xpost('/my/pm/x/extrawork/'+rid+'/stop',{kind:_kind,reason:_rsn}).then(function(r){
      if(r&&r.ok){ toast(r.msg||'تم الإرسال'); setTimeout(function(){render('extrawork');},700); }
      else toast((r&&r.error)||'تعذّر');
    }).catch(function(){toast('تعذّر الاتصال');});
    return;
  }
  if(/تعديل/.test(label)){ openEditForm(code,idx); return; }
  if(/إلغاء|حذف المسوّدة/.test(label)){
    if(!rid){ toast('لا يوجد سجل مرتبط'); return; }
    if(!confirm('إلغاء/سحب هذا الطلب؟')) return;
    xpost('/my/pm/x/cancel/'+code+'/'+rid,{}).then(function(r){
      if(r&&r.ok){ toast(r.msg||'أُلغي الطلب'); setTimeout(function(){ render(code); },650); }
      else toast((r&&r.error)||'تعذّر الإلغاء');
    }).catch(function(){ toast('تعذّر الاتصال'); });
    return;
  }
  var act=null;
  if(/اعتماد|تأكيد|موافقة|قبول/.test(label)) act='approve';
  else if(/رفض|عدم/.test(label)) act='reject';
  else if(/إرسال|تقديم/.test(label)) act='submit';
  if(!act){ toast('إجراء غير مدعوم من البوابة: '+label); return; }
  if(!rid){ toast('لا يوجد سجل مرتبط بهذا الإجراء'); return; }
  var reason='';
  if(act==='reject'){ reason=prompt('سبب الرفض (اختياري):')||''; }
  var map={approve:'اعتماد',reject:'رفض',submit:'إرسال'};
  if(!confirm('تأكيد '+(map[act]||act)+' لهذا السجل؟')) return;
  xpost('/my/pm/x/action/'+code+'/'+rid,{action:act,reason:reason}).then(function(r){
    if(r&&r.ok){ toast('تم: '+(r.msg||map[act])); setTimeout(function(){location.reload();},700); }
    else { toast((r&&r.error)||'تعذّر تنفيذ الإجراء'); }
  }).catch(function(){ toast('تعذّر الاتصال بالخادم'); });
}
/* POST بصيغة JSON يعيد كائن الاستجابة */
function xpost(url,data){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',method:'call',params:data||{}})})
    .then(function(res){return res.json();})
    .then(function(j){
      if(j&&j.result) return j.result;
      // استثناء خادم غير ملتقَط (JSON-RPC error): استخرج الرسالة بدل عرض «[object Object]»
      if(j&&j.error){
        var d=j.error.data||{};
        var msg=d.message||d.name||j.error.message||'حدث خطأ في الخادم';
        return {ok:false, error:String(msg)};
      }
      return j;
    });
}

/* تطبيع عربي: إزالة التشكيل والتطويل وتوحيد الألف/الياء/التاء المربوطة — ليطابق «مُقدَّم»=«مقدم» */
function _arNorm(s){return (s||'').toString().toLowerCase()
  .replace(/[ً-ْـٰ]/g,'')
  .replace(/[آأإ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');}
var _PMX_ST={
  active:['نشط','سار','معتمد','active','متوفر','مسلم','قائم','جار','مستلم','منجز','مفعل','يعمل','موافق'],
  wait:['بانتظار','قيد','مقدم','مسودة','submit','draft','مراجعة','معلق','pending','جديد','للاعتماد','بانتظ'],
  closed:['منته','منتهي','موقوف','مرفوض','مغلق','رفع','ended','done','مصروف','مكتمل','ملغى','ملغي','مسدد','مغلقة','مردود','خارج']
};

// Enter في البحث السريع يفصل بين البادجات: يُدرج مسافة (فيصبح كل بادج رمزًا مستقلًّا في البحث المتعدّد).
function pmxSearchKey(ev){
  if(ev.key==='Enter'){
    ev.preventDefault();
    var inp=ev.target; var v=(inp.value||'');
    if(v && !/[\s,;]$/.test(v)){ inp.value=v+' '; }
    pmxFilter();
  }
}
function pmxFilter(){
  var inp=document.getElementById('pmxSearch');
  window._pmxFilter.q=inp?(inp.value||'').trim().toLowerCase():'';
  var q=_arNorm(window._pmxFilter.q), st=window._pmxFilter.st||'all';
  var kws=(_PMX_ST[st]||null); if(kws)kws=kws.map(_arNorm);
  // بحث متعدّد: عدّة بادجات/كلمات مفصولة بمسافة أو سطر أو فاصلة ⇒ يظهر العامل المطابق لأيٍّ منها (OR).
  // يدعم لصق مجموعة بادج اي دي من إكسل، أو كتابة بادج ثم مسافة/Enter ثم بادج آخر.
  var _toks=q.split(/[\s,;]+/).filter(Boolean);
  function _match(el){
    var txt=_arNorm(el.textContent||'');
    var okQ=!_toks.length||_toks.some(function(t){return txt.indexOf(t)>=0;});
    var okS=true;
    if(kws){ var pill=el.querySelector('.pill,.wchip,.wchip-txt'); var pt=_arNorm(pill?pill.textContent:''); okS=pt?kws.some(function(k){return pt.indexOf(k)>=0;}):true; }
    return okQ&&okS;
  }
  /* صفوف الجداول */
  [].forEach.call(document.querySelectorAll('#screen table.tbl tbody tr'),function(tr){ tr.style.display=_match(tr)?'':'none'; });
  /* بطاقات الشبكة (الكتالوج/المخزون/الأصول) */
  [].forEach.call(document.querySelectorAll('#screen .gcard, #screen .mcard'),function(cd){ cd.style.display=_match(cd)?'':'none'; });
}
function _cellText(c){
  if(Array.isArray(c))return (c[0]==='f'||c[1]?(c[1]||''):(c[0]||''))+(c[2]?(' '+c[2]):'');
  if(typeof c==='string'){ if(c.indexOf('pill:')===0)return c.split(':')[2]||''; if(c.indexOf('wstat')>=0)return c.replace(/<[^>]+>/g,''); return c; }
  return ''+(c==null?'':c);
}
function pmxExport(code){
  try{
    var sc=S[code]; if(!sc||!sc.rows){toast('لا بيانات للتصدير');return;}
    var cols=(sc.cols||[]).filter(function(c){return c!=='';});
    var lines=[cols.join(',')];
    sc.rows.forEach(function(r){
      var cells=r.slice(0,cols.length).map(function(c){var t=_cellText(c).replace(/"/g,'""').replace(/\s+/g,' ').trim();return '"'+t+'"';});
      lines.push(cells.join(','));
    });
    var csv='﻿'+lines.join('\r\n'); // BOM لدعم العربية في Excel
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=(sc.title||code)+'.csv'; document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},300);
    toast('تمّ تصدير '+(sc.rows.length)+' سجل');
  }catch(e){ toast('تعذّر التصدير'); }
}

function cfApply(ov){
  var getv=function(name){var el=ov.querySelector('[data-f="'+name+'"]');return el?(el.getAttribute('data-t')==='boolean'?(el.checked?'1':''):el.value):'';};
  ov.querySelectorAll('[data-cf]').forEach(function(box){
    var sw; try{sw=JSON.parse(box.getAttribute('data-show'));}catch(e){return;}
    var show=true;
    Object.keys(sw).forEach(function(cf){ var v=String(getv(cf)); if((sw[cf]||[]).map(String).indexOf(v)<0) show=false; });
    box.style.display=show?'':'none';
    box.querySelectorAll('[data-f]').forEach(function(el){ if(show){el.removeAttribute('data-skiphidden');} else {el.setAttribute('data-skiphidden','1');} });
  });
}

function submitCreateForm(code,rid){
  var ov=document.getElementById('_cform'); if(!ov)return;
  var vals={},miss=[];
  ov.querySelectorAll('[data-f]').forEach(function(el){
    if(el.getAttribute('data-skiphidden')==='1')return; // حقل مخفيّ بالتسلسل — لا يُرسَل ولا يُتحقَّق
    var f=el.getAttribute('data-f'),t=el.getAttribute('data-t');
    var v=(t==='boolean')?el.checked:el.value;
    // أعِد ضبط لون الحدّ (في حال تصحيح سابق)
    try{ if(el.classList&&el.classList.contains('scinp')){} el.style.borderColor=''; var _sc=el.closest&&el.closest('.scwrap'); if(_sc){var _si=_sc.querySelector('.scinp'); if(_si)_si.style.borderColor='';} }catch(e){}
    if(el.hasAttribute('required')&&(v===''||v==null)&&t!=='boolean'){ miss.push(el); }
    vals[f]=v;
  });
  if(miss.length){
    var names=[];
    miss.forEach(function(el){
      var tgt=el; try{ var _sc=el.closest&&el.closest('.scwrap'); if(_sc){tgt=_sc.querySelector('.scinp')||el;} }catch(e){}
      try{ tgt.style.borderColor='#e5484d'; }catch(e){}
      var nm=_missLabel(el); if(nm&&names.indexOf(nm)<0)names.push(nm);
    });
    var tf=miss[0]; try{ var _sc=tf.closest&&tf.closest('.scwrap'); (_sc?(_sc.querySelector('.scinp')||tf):tf).focus(); }catch(e){}
    toast('أكمِل الحقول المطلوبة: '+(names.join('، ')||'المطلوبة'));
    return;
  }
  var btn=document.getElementById('_cform_save'); btn.disabled=true; btn.textContent='جارٍ الحفظ…';
  var url=rid?('/my/pm/x/update/'+code+'/'+rid):('/my/pm/x/create/'+code);
  xpost(url,{values:vals}).then(function(r){
    if(r&&r.ok){ toast((rid?'تم تعديل السجل: ':'تم إنشاء السجل: ')+(r.name||'')); ov.remove();
      if(window._wrqReturn&&window._wrqReturn.code===code){ var ret=window._wrqReturn; window._wrqReturn=null; setTimeout(function(){ openWorkerRequests(ret.code,ret.emp,ret.label); },350); }
      else { setTimeout(function(){location.reload();},700); } }
    else { btn.disabled=false; btn.textContent='حفظ';
      // الخطأ يظهر أعلى الديالوج (شريط بارز) بدل toast أسفله
      var em=(r&&r.error)||'تعذّر الحفظ'; var eb=document.getElementById('_cform_err');
      if(eb){ eb.textContent=em; eb.style.display='block'; var _bd=eb.closest('._cform_body'); if(_bd)_bd.scrollTop=0; }
      else toast(em); }
  }).catch(function(){ btn.disabled=false; btn.textContent='حفظ';
      var eb=document.getElementById('_cform_err'); var em='تعذّر الاتصال بالخادم';
      if(eb){ eb.textContent=em; eb.style.display='block'; } else toast(em); });
}
function allowanceStop(id){
  if(!id){toast('لا يوجد معرّف للسجل');return;}
  var today=new Date().toISOString().slice(0,10);
  var date=window.prompt('تاريخ إيقاف البدل (YYYY-MM-DD) — يتوقّف الاستحقاق بعده:',today);
  if(date===null)return;
  if(!(''+date).trim()){toast('تاريخ الإيقاف مطلوب');return;}
  var reason=window.prompt('سبب إيقاف البدل:','');
  if(reason===null)return;
  if(!(''+reason).trim()){toast('سبب الإيقاف مطلوب');return;}
  var fd=new FormData(); fd.append('reason',reason); fd.append('stop_date',date);
  fetch('/my/pm/x/allowance/'+id+'/stop',{method:'POST',body:fd})
   .then(function(r){return r.json();})
   .then(function(d){ toast(d.ok?'✓ تم إرسال طلب إيقاف البدل':('تعذّر: '+(d.msg||''))); if(d.ok)setTimeout(function(){render('allowances');},900); })
   .catch(function(){toast('خطأ في الاتصال');});
}

/* ============ Renderers ============ */
function statCard(s){
  const [label,val,si,accent,dir,delta,sp]=s;
  const icon=(si||'si:chart').split(':')[1];
  const acc=(accent||'accent:var(--navy-600)').split('accent:')[1];
  const accBg=`color-mix(in srgb, ${acc} 13%, var(--surface))`;
  const sparkData=(sp||'spark:[1,2,3]').replace('spark:','');
  let arr=[1,2,3];try{arr=JSON.parse(sparkData)}catch(e){}
  const chipCls=dir==='up'?'up':dir==='down'?'down':'flat';
  const arrow=dir==='up'?'▲':dir==='down'?'▼':'•';
  return `<div class="stat" style="--accent:${acc};--accent-bg:${accBg}">
    <div class="sl"><span class="si">${ic(icon,16)}</span>${label}</div>
    <div style="display:flex;align-items:flex-end;gap:8px">
      <div class="sv num">${val}</div>${spark(arr,acc)}
    </div>
    <div class="sf"><span class="chip ${chipCls}">${arrow} ${delta}</span><span class="ssub">عن الشهر السابق</span></div>
  </div>`;
}
function cell(c){
  if(Array.isArray(c)){ // worker/ref cell
    const [kind,main,sub,wcls,wtxt,empId]=c;
    const lead = kind==='f'?wphoto(main,empId):kind?`<span class="avatarmini" style="background:var(--gold-soft);color:var(--navy)">${kind}</span>`:'';
    const wc = (wcls&&wtxt)?` <span class="wchip ${wcls}">${wtxt}</span>`:'';
    return `<td><div class="cellflex">${lead}<div><div class="main">${main}${wc}</div>${sub?`<div class="sub">${sub}</div>`:''}</div></div></td>`;
  }
  if(typeof c==='string' && c.startsWith('pill:')){const[,cls,txt]=c.split(':');return `<td><span class="pill ${cls}">${txt}</span></td>`;}
  if(typeof c==='string' && (c.startsWith('<span class="wstat'))) return `<td>${c}</td>`;
  return `<td class="num">${c}</td>`;
}

function tableScreen(sc,code){
  const canEdit=_canCreate(code);

  if(!sc.rows||!sc.rows.length){ return '<div class="panel"><div class="panel-h"><h3>'+_esc(sc.title||'')+'</h3><span class="cnt">0 سجل</span></div>'+emptyState(sc,code)+'</div>'; }
  const head=(canApprove?'<th class="bchk"><input type="checkbox" id="_ball" onclick="bulkAll(this.checked)" title="تحديد الكل"></th>':'')+sc.cols.map(c=>`<th>${c}</th>`).join('');
  const body=sc.rows.map((r,idx)=>{
    const cells=r.map(cell).join('');
    const rid=(sc.ids||[])[idx];
    const chk=canApprove?`<td class="bchk" onclick="event.stopPropagation()"><input type="checkbox" class="_brow" data-idx="${idx}"${rid?'':' disabled'} onclick="bulkToggle()"></td>`:'';
    const canPrint=(sc.can_print!==false) && (!_deleg()||_delegPerm(code,'print'));
    const prtBtn=canPrint?`<button title="${TT('طباعة')}" onclick="printRec('${code}',${idx})"${rid?'':' style="opacity:.35"'}>${ic('print',15)}</button>`:'';

    return `<tr style="cursor:pointer" onclick="openDetail('${code}',${idx})">${chk}${cells}${act}</tr>`;
  }).join('');
  const bulkHtml=canApprove?`<div id="bulkbar" class="bulkbar" hidden><span class="bcount"><b id="_bn">0</b> محدَّد</span>
      <span style="flex:1"></span>

      <button class="btn" style="background:var(--navy-600);color:#fff;padding:7px 12px" onclick="bulkAct('submit')">${ic('play',15)} إرسال</button>
      <button class="btn" style="background:var(--c-rose);color:#fff;padding:7px 12px" onclick="bulkAct('reject')">${ic('x',15)} رفض</button>
      ${code==='requests'?`<button class="btn" style="background:var(--navy);color:#fff;padding:7px 12px" onclick="bulkPrintCards()">${ic('print',15)} طباعة الكروت</button>`:''}

      <button class="btn ghost" style="padding:7px 10px" onclick="bulkClear()">${ic('x',14)}</button></div>`:'';
  return `<div class="panel"><div class="panel-h"><h3>${sc.title}</h3><span class="cnt">${sc.rows.length} سجل</span>
    <span class="tspace" style="margin-inline-start:auto"></span>

function _bsel(){return [].slice.call(document.querySelectorAll('._brow:checked')).map(function(c){return +c.getAttribute('data-idx');});}
function bulkToggle(){var n=_bsel().length,bar=document.getElementById('bulkbar');if(bar){bar.hidden=n===0;var bn=document.getElementById('_bn');if(bn)bn.textContent=n;}var all=document.getElementById('_ball');if(all){var tot=document.querySelectorAll('._brow:not([disabled])').length;all.checked=n>0&&n===tot;all.indeterminate=n>0&&n<tot;}}
function bulkAll(v){document.querySelectorAll('._brow:not([disabled])').forEach(function(c){c.checked=v;});bulkToggle();}
function bulkClear(){document.querySelectorAll('._brow').forEach(function(c){c.checked=false;});bulkToggle();}
function bulkAct(action){
  var idxs=_bsel(); if(!idxs.length){toast('حدِّد سجلات أولًا');return;}
  var code=_cur, ids=(S[code]&&S[code].ids)||[];
  var rids=idxs.map(function(i){return ids[i];}).filter(Boolean);
  if(!rids.length){toast('لا سجلات صالحة');return;}
  var lbl={approve:'اعتماد',submit:'إرسال',reject:'رفض'}[action]||action;
  var reason=''; if(action==='reject'){reason=prompt('سبب الرفض (اختياري، يُطبَّق على الكل):')||'';}
  if(!confirm(lbl+' '+rids.length+' سجلًّا؟')) return;
  xpost('/my/pm/x/bulk/'+code+'/'+action,{rids:rids,reason:reason}).then(function(r){
    if(r&&r.ok){ toast('تم: '+r.done+(r.failed?(' · فشل '+r.failed):'')+(r.skipped?(' · تُخطّي '+r.skipped):'')); setTimeout(function(){render(code);},700); }
    else toast((r&&r.error)||'تعذّر التنفيذ الجماعي');
  }).catch(function(){toast('تعذّر الاتصال');});
}
function bulkPrintCards(){

function bulkExport(){

  var cols=sc.cols||[], out=[cols.filter(function(c){return c;}).map(function(c){return '"'+c+'"';}).join(',')];
  idxs.forEach(function(i){ var r=sc.rows[i]; if(!r)return;
    out.push(r.slice(0,cols.length).map(function(c){var t=_cellText(c).replace(/"/g,'""').replace(/\s+/g,' ').trim();return '"'+t+'"';}).join(',')); });
  var blob=new Blob(["﻿"+out.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(CODE_LABEL[code]||code)+'_selected.csv'; a.click();
  toast('تم تصدير '+idxs.length+' سجلًّا');
}

/* رسم بياني مساحي مُضمَّن (SVG) من [[تسمية,قيمة],...] — متوافق مع الثيمين */
function areaChart(data,color){
  color=color||'teal'; var n=(data||[]).length; if(!n)return '';
  var vals=data.map(function(d){return +d[1]||0;});
  var max=Math.max.apply(null,vals.concat([1]));
  var W=100,H=34,pad=2, step=n>1?(W-pad*2)/(n-1):0;
  function x(i){return (pad+i*step).toFixed(2);} function y(v){return (H-pad-(v/max)*(H-pad*2)).toFixed(2);}
  var pts=vals.map(function(v,i){return x(i)+','+y(v);});
  var line='M'+pts.join(' L');
  var area='M'+x(0)+','+(H-pad)+' L'+pts.join(' L')+' L'+x(n-1)+','+(H-pad)+' Z';
  var cid='g'+Math.random().toString(36).slice(2,7);
  var last=vals[n-1], peak=Math.max.apply(null,vals), avg=Math.round(vals.reduce(function(a,b){return a+b;},0)/n);
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:220px">'
    +'<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:72px;display:block">'
      +'<defs><linearGradient id="'+cid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-'+color+')" stop-opacity="0.26"/><stop offset="1" stop-color="var(--c-'+color+')" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+area+'" fill="url(#'+cid+')"/>'
      +'<path d="'+line+'" fill="none" stroke="var(--c-'+color+')" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+x(n-1)+'" cy="'+y(last)+'" r="1.9" fill="var(--c-'+color+')"/></svg>'
    +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px"><span>'+_esc(data[0][0])+'</span><span>'+_esc(data[n-1][0])+'</span></div></div>'
    +'<div style="display:flex;gap:18px">'
      +'<div><div class="num" style="font-size:21px;font-weight:800;color:var(--c-'+color+')">'+last+'</div><div style="font-size:10.5px;color:var(--muted)">اليوم</div></div>'
      +'<div><div class="num" style="font-size:21px;font-weight:800">'+avg+'</div><div style="font-size:10.5px;color:var(--muted)">المتوسّط</div></div>'
      +'<div><div class="num" style="font-size:21px;font-weight:800">'+peak+'</div><div style="font-size:10.5px;color:var(--muted)">الذروة</div></div>'
    +'</div></div>';
}

function countUp(el){
  const raw=el.textContent.trim();
  const m=raw.match(/^(\D*?)([\d.,]+)(.*)$/);
  if(!m)return;
  const pre=m[1],numStr=m[2],suf=m[3];
  const hasComma=numStr.includes(',');
  const dec=(numStr.split('.')[1]||'').length;
  const target=parseFloat(numStr.replace(/,/g,''));
  if(isNaN(target))return;
  const t0=performance.now(),dur=760;
  const fmt=v=>{const r=dec?v.toFixed(dec):Math.round(v);
    let s=''+r; if(hasComma)s=Number(r).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
    return pre+s+suf;};
  requestAnimationFrame(function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(target*e);if(p<1)requestAnimationFrame(step);});
}

    +'<div><label class="fl">رقم المستند <span style="color:#e5484d">*</span></label><input id="_drNum" value="'+_esc(d.number||'')+'" style="'+inp+'"></div>'

function docReqFile(input,key){
  var f=input.files&&input.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){ window._docreqFiles[key]=rd.result;
    var pv=document.getElementById('_drPrev_'+key);
    if(pv){ if(key==='pdf'){pv.textContent='📄 '+(f.name||'PDF');} else {pv.style.backgroundImage='url('+rd.result+')';pv.textContent='';} } };
  rd.readAsDataURL(f);
}
function docReqUpload(rid,submit){
  var g=function(id){return (document.getElementById(id)||{}).value||'';};
  var fl=window._docreqFiles||{};
  if(submit){
    if(!(fl.front||fl.pdf)){toast('أرفق صورة الأمام أو ملف PDF');return;}
    if(!g('_drNum')){toast('أدخل رقم المستند');return;}
    if(!g('_drIssue')||!g('_drExp')){toast('أدخل تاريخَي الإصدار والانتهاء');return;}
  }
  var data={rid:rid,number:g('_drNum'),issue_date:g('_drIssue'),expiry_date:g('_drExp'),
            front:fl.front||'',back:fl.back||'',pdf:fl.pdf||'',submit:submit};
  if(submit && !confirm('رفع المستند وإرساله لاعتماد الموارد البشرية؟'))return;
  xpost('/my/pm/x/docreq/upload',data).then(function(r){
    if(r&&r.ok){toast(r.msg||'تم');setTimeout(function(){try{openDetail('requests',_d.i);}catch(e){render('requests');}},800);}else toast((r&&r.error)||'تعذّر');
  }).catch(function(){toast('تعذّر الاتصال');});
}

function _tsCats(w){
  var cats=[], hasP=false, nwTot=0, nwAbs=0;
  (w.days||[]).forEach(function(dy){
    var s=dy.status;
    if(s==='P'||s==='T'||s==='E')hasP=true;
    if(s&&s!=='O'&&s!=='H'&&s!=='X'){ nwTot++; if(s==='A')nwAbs++; }
  });
  if(hasP)cats.push('present');
  if(nwTot>0&&nwAbs===nwTot)cats.push('absent');
  if(w.leave>0)cats.push('leave');
  if(w.sick>0)cats.push('sick');
  if(w.holiday>0)cats.push('holiday');
  if(w.off>0)cats.push('off');
  if(w.out>0)cats.push('transfer');
  if((w.extra_rows&&w.extra_rows.length)||(w.extra_hours&&w.extra_hours>0))cats.push('extra');
  if(w.sub_rows_x&&w.sub_rows_x.length)cats.push('sub');
  if(w.hadd)cats.push('hadd');
  if(w.hded)cats.push('hded');
  if(w.plane)cats.push('plane');
  return cats;
}

function translateLeaves(root){
  if(!root)return;
  try{
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,ns=[];
    while(n=w.nextNode())ns.push(n);
    ns.forEach(function(tn){ var v=tn.nodeValue,k=v.trim();
      if(k&&HTR[k]!==undefined){ tn.nodeValue=v.replace(k,HTR[k]); return; }
      var mm=k.match(/^(\d+)\s*([؀-ۿ]+)$/);
      if(mm&&UNIT[mm[2]]){ var en=UNIT[mm[2]]; if(+mm[1]!==1)en+='s'; tn.nodeValue=v.replace(k, mm[1]+' '+en); }
    });
  }catch(e){}
}

  var ql=q.toLowerCase();

    if(sc.rows){
      sc.rows.forEach(function(r,idx){
        var txt=r.map(function(c){return _cellText(c);}).join(' ').toLowerCase();
        if(txt.indexOf(ql)>=0){
          var f=Array.isArray(r[0])?r[0]:null;
          items.push({code:code,idx:idx,title:(f?(f[1]||f[0]):(''+r[0])),sub:(f?(f[2]||''):'')});
        }

    } else if(sc.plist){

    } else if(sc.cards){

function gsKey(e){

  return '<div style="background:linear-gradient(135deg,#0a1f44,#12306e);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:10px"><span style="font-weight:900;font-size:15px">🔑 تفويض إدارة القوائم</span><span style="font-size:11px;opacity:.82">'+_esc((d&&d.project)||'')+'</span><button onclick="var m=document.getElementById(\'_delegmgr\');if(m)m.remove();" style="margin-inline-start:auto;background:rgba(255,255,255,.15);border:0;color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px">✕</button></div>'
    +'<div style="padding:16px;max-height:76vh;overflow:auto">'
    +'<div style="font-weight:800;font-size:12.5px;margin-bottom:8px;color:var(--navy-600)">تفويض جديد</div>'
    +'<div style="position:relative;margin-bottom:9px"><input id="_delUserQ" autocomplete="off" placeholder="ابحث عن مستخدم: الاسم أو الإيميل أو رقم البادج…" oninput="delegUserSearch(this.value)" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit"><div id="_delUserRes" style="position:absolute;top:100%;inset-inline:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:3px;max-height:210px;overflow:auto;display:none;box-shadow:0 12px 30px rgba(0,0,0,.25)"></div></div>'
    +'<div id="_delUserPick" style="font-size:11.5px;color:var(--c-emerald);font-weight:700;margin-bottom:9px;min-height:16px"></div>'
    +'<div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:9px"><label style="font-size:11.5px;color:var(--muted)">القائمة</label><select id="_delSec" style="padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font:inherit;flex:1;min-width:160px">'+secOpts+'</select></div>'
    +'<div style="display:flex;gap:13px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--surface-2);border-radius:10px">'
    +[['read','قراءة'],['write','تعديل'],['cancel','إلغاء'],['submit','إرسال للاعتماد'],['print','طباعة']].map(function(p){return '<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600"><input type="checkbox" id="_dp_'+p[0]+'"'+(p[0]==='read'?' checked':'')+'> '+p[1]+'</label>';}).join('')
    +'</div>'
    +'<button class="btn" style="background:var(--navy-600);color:#fff;width:100%;justify-content:center;padding:10px" onclick="delegSave()">'+ic('check',15)+' حفظ التفويض</button>'
    +'<div style="font-weight:800;font-size:12.5px;margin:16px 0 6px;color:var(--navy-600)">التفويضات الحالية ('+items.length+')</div>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:var(--surface-2)"><th style="padding:6px 8px;text-align:start">المستخدم</th><th style="padding:6px 8px;text-align:start">القائمة</th><th style="padding:6px 8px;text-align:start">الصلاحيات</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'

}

/* اختصار عالمي: Ctrl/⌘+K أو «/» يركّز البحث؛ Esc يغلق */
/* ===== طبقة إتاحة الوصول (a11y): حصر التركيز + Esc + ARIA لكل النوافذ تلقائيًّا ===== */
(function(){
  var FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  var stack=[]; // {ov, prev}
  function isOverlay(n){
    if(!n||n.nodeType!==1||n.tagName!=='DIV')return false;
    var st=n.getAttribute('style')||'';
    return /position:\s*fixed/.test(st)&&/inset:\s*0/.test(st)&&n.id!=='_toast';
  }
  function focusables(ov){ return Array.prototype.filter.call(ov.querySelectorAll(FOCUSABLE),function(el){return el.offsetParent!==null||el===document.activeElement;}); }
  function focusFirst(ov){
    var f=ov.querySelector('input:not([type=hidden]):not([disabled]),textarea:not([disabled]),select:not([disabled])');
    if(!f){ var all=focusables(ov); f=all.find(function(el){return !/×/.test(el.textContent||'');})||all[0]; }
    try{ (f||ov).focus(); }catch(e){}
  }
  function closeTop(){
    if(!stack.length)return false;
    var ov=stack[stack.length-1].ov;
    var x=ov.querySelector('[data-close],[onclick*="remove()"]');
    if(x){ try{x.click(); return true;}catch(e){} }
    ov.remove(); return true;
  }
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      Array.prototype.forEach.call(m.addedNodes,function(n){
        if(isOverlay(n)&&!n._a11y){
          n._a11y=true;
          n.setAttribute('role','dialog'); n.setAttribute('aria-modal','true');
          if(!n.hasAttribute('tabindex'))n.setAttribute('tabindex','-1');
          var h=n.querySelector('h1,h2,h3,b,strong'); if(!n.getAttribute('aria-label'))n.setAttribute('aria-label',((h&&h.textContent)||(L==='en'?'Dialog':'نافذة حوار')).trim().slice(0,80));
          stack.push({ov:n,prev:document.activeElement});
          setTimeout(function(){focusFirst(n);},30);
        }
      });
      Array.prototype.forEach.call(m.removedNodes,function(n){
        if(n&&n._a11y){
          for(var i=stack.length-1;i>=0;i--){ if(stack[i].ov===n){ var pv=stack[i].prev; stack.splice(i,1); try{if(pv&&pv.focus)pv.focus();}catch(e){} break; } }
        }
      });
    });
  });
  mo.observe(document.body,{childList:true});
  document.addEventListener('keydown',function(e){
    if(!stack.length)return;
    var top=stack[stack.length-1].ov;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeTop(); return; }
    if(e.key==='Tab'){
      var f=focusables(top); if(!f.length){ e.preventDefault(); top.focus(); return; }
      var first=f[0], last=f[f.length-1], a=document.activeElement;
      if(e.shiftKey&&(a===first||!top.contains(a))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&(a===last||!top.contains(a))){ e.preventDefault(); first.focus(); }
    }
  },true);
})();
document.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName)||'';
  var typing=(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.isContentEditable);
  if((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); openPalette(); }
  else if(e.key==='/'&&!typing){ e.preventDefault(); var s2=document.getElementById('gsearch'); if(s2)s2.focus(); }
  else if(e.key==='Escape'){ var g=document.getElementById('gsres'); if(g&&!g.hidden){g.hidden=true;} var si=document.getElementById('gsearch'); if(si&&document.activeElement===si){si.value='';si.blur();} }
});
